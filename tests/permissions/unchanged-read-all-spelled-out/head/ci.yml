on: pull_request
permissions:
  actions: read
  artifact-metadata: read
  attestations: read
  checks: read
  contents: read
  deployments: read
  discussions: read
  id-token: none
  issues: read
  models: read
  packages: read
  pages: read
  pull-requests: read
  repository-projects: read
  security-events: read
  statuses: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - run: make
