[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# The PyPI name `sabline`, held so that nobody else can publish under it.
# It has no code of its own: installing it installs sabline-lang.
# packaging/placeholders/README.md says why, and how it is published.
[project]
name = "sabline"
version = "0.1.0"
description = "Sabline is published as sabline-lang; installing this installs it."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Palakurthi Gowri Shankar" }]
dependencies = ["sabline-lang"]

[project.urls]
Homepage = "https://github.com/gowrishankar-infra/sabline-lang"
"The package" = "https://pypi.org/project/sabline-lang/"

[tool.hatch.build.targets.wheel]
bypass-selection = true
