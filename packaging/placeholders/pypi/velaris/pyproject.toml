[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# The PyPI name `velaris`, held so that nobody else can publish under it.
# It has no code of its own: installing it installs velaris-lang.
# packaging/placeholders/README.md says why, and how it is published.
[project]
name = "velaris"
version = "0.1.0"
description = "Velaris is published as velaris-lang; installing this installs it."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Palakurthi Gowri Shankar" }]
dependencies = ["velaris-lang"]

[project.urls]
Homepage = "https://github.com/gowrishankar-infra/velaris-lang"
"The package" = "https://pypi.org/project/velaris-lang/"

[tool.hatch.build.targets.wheel]
bypass-selection = true
