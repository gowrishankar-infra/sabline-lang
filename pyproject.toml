[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sabline-lang"
version = "8.6.0"
description = "The language where you can trust code you didn't write - signatures declare types, effects, and machine-checked promises."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Palakurthi Gowri Shankar" }]
keywords = ["language", "compiler", "verification", "effects", "contracts", "z3"]

[project.optional-dependencies]
full = ["z3-solver", "llvmlite"]
# for the suites only, never for Sabline itself: jsonschema validates
# check_library.py's SARIF output against the OASIS schema, and fastapi
# with an http client is what examples/platform is written against, so
# check_platform.py can exercise it rather than skip; pyyaml reads
# action.yml and the workflows for check_api.py and check_release.py; and
# hypothesis generates the programs check_properties.py holds to its laws
test = ["jsonschema>=4.18", "fastapi", "httpx", "pyyaml", "hypothesis"]

[project.scripts]
sabline = "sabline:main"
# The name this command had until 8.6 renamed the project. It runs the
# same command and says once that the name has changed; it goes no sooner
# than 9.0 (STABILITY.md, "Deprecations in force").
velaris = "sabline.cli:velaris_main"

[project.urls]
Homepage = "https://sabline.dev/"
Documentation = "https://sabline.dev/"
Source = "https://github.com/gowrishankar-infra/sabline-lang"
Changelog = "https://github.com/gowrishankar-infra/sabline-lang/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
only-include = ["sabline", "sabline_mcp.py", "sabline_mcp_install.py",
                "sabline_magic.py",
                # the old names, kept until 9.0 (velaris/__init__.py)
                "velaris", "velaris_mcp.py", "velaris_mcp_install.py",
                "velaris_magic.py"]

[tool.hatch.build.targets.wheel.force-include]
"LLM.md" = "LLM.md"
"sabline_mcp.py" = "sabline_mcp.py"
"sabline_mcp_install.py" = "sabline_mcp_install.py"
"sabline_magic.py" = "sabline_magic.py"
"velaris_mcp.py" = "velaris_mcp.py"
"velaris_mcp_install.py" = "velaris_mcp_install.py"
"velaris_magic.py" = "velaris_magic.py"
"stdlib" = "stdlib"

[tool.hatch.build]

# check_lint.py runs both over every Python file in the repository (8.2)
[tool.mypy]
strict = true
python_version = "3.10"
# the lint job runs on Linux; checking as Linux everywhere gives every
# machine its answer (a branch for Windows is still checked, as Linux sees it)
platform = "linux"

[[tool.mypy.overrides]]
# ship no type information
module = ["z3", "z3.*", "llvmlite", "llvmlite.*", "atheris", "atheris.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# optional, for one command or integration, and not installed by the lint
# job: read as Any wherever they are, so every machine checks the same
module = [
    "IPython", "IPython.*", "PyInstaller", "PyInstaller.*",
    "anthropic", "anthropic.*", "openai", "openai.*",
    "crewai", "crewai.*", "langchain_core", "langchain_core.*",
    "pytest", "pytest.*", "sigstore", "sigstore.*",
]
follow_imports = "skip"
ignore_missing_imports = true

[tool.ruff]
target-version = "py310"

