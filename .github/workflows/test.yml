name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.10", "3.12"]
        deps: [full, minimal]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      # [test] is jsonschema, which the suites use to validate SARIF
      # output; it is not a dependency of Velaris
      - name: Install (full - with Z3 proofs and LLVM native)
        if: matrix.deps == 'full'
        run: pip install ".[full,test]"
      - name: Install (minimal - runtime checks, interpreted)
        if: matrix.deps == 'minimal'
        run: pip install ".[test]"
      - name: Version
        run: velaris --version
      # velaris-spec: its conformance corpus, and the schemas the library
      # suite holds audits and attestations to. It holds no .vel file, so
      # the capability check below still sees this repository alone.
      - name: velaris-spec, for its corpus and schemas
        uses: actions/checkout@v5
        with:
          repository: gowrishankar-infra/velaris-spec
          path: velaris-spec
      # OPA, so check_policies.py runs `opa test` and `opa eval` rather than
      # skipping them
      - name: OPA, for the policy's tests
        uses: open-policy-agent/setup-opa@b2b258e089860efaadaaf71bf6e3aecb4a3eeff1  # v2.4.0
        with:
          version: "1.20.2"
      - name: Test suite
        run: python run_tests.py
      - name: Native and interpreted agree (random programs)
        run: python fuzz_native.py 60
      - name: How much is proven
        run: velaris proofs examples stdlib || true
      - name: The library and MCP server keep the same guarantees
        run: python check_library.py
      - name: Every fallible builtin is enforced
        run: python check_fallible.py
      - name: Amounts are exact, in one currency, and round only where named
        run: python check_money.py
      - name: The sandbox cannot be escaped
        run: python check_sandbox.py
      - name: A Secret reaches nothing that emits it
        run: python check_secret.py
      - name: A worker pool leaks nothing between programs
        run: python check_pool.py
      - name: The reference platform refuses what it says it refuses
        run: python check_platform.py
      - name: An ejected program runs with nothing from here, and holds its budget
        run: python check_eject.py
      - name: The OPA policy and its Kyverno twin ask what they say
        run: python check_policies.py
      - name: Every loop gets the termination verdict it must
        run: python check_termination.py
      - name: Every widening of the capability surface fails, and nothing else does
        run: python check_ratchet.py
      - name: An upgrade's gained surface is reported, and unknown is said to be unknown
        run: python check_deps.py
      - name: This repository needs nothing its velaris.capabilities does not declare
        run: velaris capabilities check .
      - name: velaris-spec's corpus is what these suites say (drift test)
        run: python build_conformance.py --check velaris-spec/tests
      - name: Conformant at L1, L2 and L3 against velaris-spec's corpus
        run: velaris conformance --corpus velaris-spec/tests
      - name: Benchmark harness (one program per category; Deno rows may be absent)
        if: matrix.deps == 'full'
        run: python benchmark/run.py --quick --check
      - name: Wrong programs are refused for the right reason
        run: python check_refusals.py
      - name: The 7.1.1 adversarial pass stays closed
        run: python check_adversarial.py
      - name: A lie is never proven (Goal A corpus)
        run: python check_prover_lies.py
      - name: The audit is unchanged by shape, and moves only with an effect
        run: python check_metamorphic.py
      - name: Edge, property and round-trip tests
        run: velaris examples/edges.vel --allow ffi:datetime,io
      - name: Velaris tests written in Velaris
        run: velaris test examples/std_test.vel
      - name: Compile check (every example compiles)
        run: velaris check examples/*.vel examples/lib/*.vel stdlib/*.vel || true
      - name: Formatter check (repo is canonically formatted)
        shell: bash
        run: velaris fmt examples/*.vel examples/lib/*.vel stdlib/*.vel --check
      - name: Playground builds
        run: python build_playground.py
      - name: Docs site builds
        run: python build_docs.py

  # Two suites at once, from one checkout, as two local configurations run
  # side by side: every suite writes to a directory of its own and keeps
  # its own proof cache (suite_dirs.py), so neither may see the other's
  # files. Each pair runs the same suite twice together.
  concurrent:
    name: suites run twice at once, from one checkout
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install (full)
        run: pip install ".[full,test]"
      - name: velaris-spec, for the schemas
        uses: actions/checkout@v5
        with:
          repository: gowrishankar-infra/velaris-spec
          path: velaris-spec
      - name: run_tests (native and --no-native), check_library, check_adversarial and fuzz_native, each twice at once
        shell: bash
        run: |
          python run_tests.py > run_tests-a.log 2>&1 & p1=$!
          python run_tests.py --no-native > run_tests-b.log 2>&1 & p2=$!
          python check_library.py > check_library-a.log 2>&1 & p3=$!
          python check_library.py > check_library-b.log 2>&1 & p4=$!
          python check_adversarial.py > check_adversarial-a.log 2>&1 & p5=$!
          python check_adversarial.py > check_adversarial-b.log 2>&1 & p6=$!
          python fuzz_native.py 30 > fuzz_native-a.log 2>&1 & p7=$!
          python fuzz_native.py 30 > fuzz_native-b.log 2>&1 & p8=$!
          status=0
          for pair in "run_tests-a $p1" "run_tests-b $p2" "check_library-a $p3" \
                      "check_library-b $p4" "check_adversarial-a $p5" \
                      "check_adversarial-b $p6" "fuzz_native-a $p7" "fuzz_native-b $p8"; do
            set -- $pair
            if wait "$2"; then echo "passed: $1"; else echo "::error::$1 failed"; status=1; fi
          done
          for log in *.log; do echo "===== $log"; tail -n 25 "$log"; done
          exit $status
