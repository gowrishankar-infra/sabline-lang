name: tests

on:
  push:
    branches: [main]
  pull_request:

# What runs where, and where to look when something is red: MAINTENANCE.md.

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }} / ${{ matrix.deps }}
    # Python 3.14 is run and reported, and allowed to fail: a red 3.14 leg
    # does not fail the run, so it does not hold up a release (8.2)
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        # x64 on all three systems, both Pythons, with and without the
        # optional dependencies: twelve legs
        os: [ubuntu-latest, windows-latest, macos-15-intel]
        python: ["3.10", "3.12"]
        deps: [full, minimal]
        experimental: [false]
        # arm64 on Linux and macOS, and Python 3.14: six more (8.2)
        include:
          - {os: ubuntu-24.04-arm, python: "3.12", deps: full, experimental: false}
          - {os: ubuntu-24.04-arm, python: "3.12", deps: minimal, experimental: false}
          - {os: macos-latest, python: "3.12", deps: full, experimental: false}
          - {os: macos-latest, python: "3.12", deps: minimal, experimental: false}
          - {os: ubuntu-latest, python: "3.14", deps: full, experimental: true}
          - {os: ubuntu-latest, python: "3.14", deps: minimal, experimental: true}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          allow-prereleases: true
      # [test] is what the suites need and Velaris does not: jsonschema,
      # fastapi and httpx, pyyaml, hypothesis
      - name: Install (full - with Z3 proofs and LLVM native)
        if: matrix.deps == 'full'
        run: pip install -c requirements/ci.txt ".[full,test]"
      - name: Install (minimal - runtime checks, interpreted)
        if: matrix.deps == 'minimal'
        run: pip install -c requirements/ci.txt ".[test]"
      - name: Version
        run: velaris --version
      # velaris-spec: its conformance corpus, and the schemas the library
      # suite holds audits and attestations to. It holds no .vel file, so
      # the capability check below still sees this repository alone.
      - name: velaris-spec, for its corpus and schemas
        uses: actions/checkout@v5
        with:
          repository: gowrishankar-infra/velaris-spec
          path: velaris-spec
      # OPA, so check_policies.py runs `opa test` and `opa eval` rather than
      # skipping them
      - name: OPA, for the policy's tests
        uses: open-policy-agent/setup-opa@b2b258e089860efaadaaf71bf6e3aecb4a3eeff1  # v2.4.0
        with:
          version: "1.20.2"
      - name: Test suite
        run: python run_tests.py
      - name: Each stage on its own (unit tests, and the modules' pipeline order)
        run: python run_unit_tests.py
      - name: Native and interpreted agree (random programs)
        run: python fuzz_native.py 60
      - name: The parsers, JSON, CSV, py_json and the contract translator, fuzzed (30 each)
        run: python fuzz_parsers.py 30
      - name: How much is proven
        run: velaris proofs examples stdlib || true
      - name: The library and MCP server keep the same guarantees
        run: python check_library.py
      - name: What the library, the command line, the doors and the Action offer, held to a golden
        run: python check_api.py
      - name: Every command answers --help; stats --ffi; z3 and llvmlite imported only when used
        run: python check_cli.py
      - name: Every error code's message, held to a golden
        run: python check_error_messages.py
      - name: The release gate, the kill switch and a release that fails midway
        run: python check_release.py
      - name: The scheduled workflows report and change nothing; open_issues.py and adversarial_models.py
        run: python check_workflows.py
      - name: The nightly's probes, each against a local install; a program that is not there is one BROKEN line
        run: python check_nightly.py
      - name: Every fallible builtin is enforced
        run: python check_fallible.py
      - name: Amounts are exact, in one currency, and round only where named
        run: python check_money.py
      - name: The sandbox cannot be escaped
        run: python check_sandbox.py
      - name: A Secret reaches nothing that emits it
        run: python check_secret.py
      - name: A worker pool leaks nothing between programs
        run: python check_pool.py
      - name: The reference platform refuses what it says it refuses
        run: python check_platform.py
      - name: An ejected program runs with nothing from here, and holds its budget
        run: python check_eject.py
      - name: velaris eval holds its profile, and refuses every relaxation
        run: python check_eval.py
      - name: receipts diff names each difference; replay runs the same bytes or refuses
        run: python check_receipts.py
      - name: A false promise the prover left to runtime is caught by a witness; effects are refused
        run: python check_from_contracts.py
      - name: What docs/structurally-impossible.md says cannot occur, tried
        run: python check_impossible.py
      - name: The OPA policy and its Kyverno twin ask what they say
        run: python check_policies.py
      - name: Every loop gets the termination verdict it must
        run: python check_termination.py
      - name: Every widening of the capability surface fails, and nothing else does
        run: python check_ratchet.py
      - name: An upgrade's gained surface is reported, and unknown is said to be unknown
        run: python check_deps.py
      - name: A widened workflow permission fails, and nothing else does
        run: python check_permissions.py
      - name: Every mutant the monthly run left alive in a guarantee's lines is killed by a test
        run: python check_mutant_kills.py
      - name: This repository needs nothing its velaris.capabilities does not declare
        run: velaris capabilities check .
      - name: velaris-spec's corpus is what these suites say (drift test)
        run: python build_conformance.py --check velaris-spec/tests
      - name: Conformant at L1, L2 and L3 against velaris-spec's corpus
        run: velaris conformance --corpus velaris-spec/tests
      - name: Benchmark harness (one program per category; Deno rows may be absent)
        if: matrix.deps == 'full'
        run: python benchmark/run.py --quick --check
      - name: Wrong programs are refused for the right reason
        run: python check_refusals.py
      - name: Every adversarial pass stays closed
        run: python check_adversarial.py
      - name: A lie is never proven, under five Z3 seeds (Goal A corpus)
        run: python check_prover_lies.py
      - name: The audit is unchanged by shape, and moves only with an effect
        run: python check_metamorphic.py
      - name: Hostile resources end in a coded error, never a traceback
        run: python check_hostile.py
      - name: Nothing a program or its surroundings control widens its budget or its audit
        run: python check_self_budget.py
      - name: Properties over generated programs (formatter, check, audit against the run)
        run: python check_properties.py
      - name: The documents are true (code blocks run, commands run, counts and codes match)
        run: python check_docs.py
      # the ten tasks with their recorded replies: no model and no network;
      # with a key the same command asks the model (agent_loop.py)
      - name: The model round trip, replayed (agent_loop.py --metric --offline)
        run: python agent_loop.py --metric --offline
      - name: Edge, property and round-trip tests
        run: velaris examples/edges.vel --allow ffi:datetime,io
      - name: Velaris tests written in Velaris
        run: velaris test examples/std_test.vel
      - name: Compile check (every example compiles)
        run: velaris check examples/*.vel examples/lib/*.vel stdlib/*.vel || true
      - name: Formatter check (repo is canonically formatted)
        shell: bash
        run: velaris fmt examples/*.vel examples/lib/*.vel stdlib/*.vel --check
      - name: Playground builds
        run: python build_playground.py
      - name: Docs site builds
        run: python build_docs.py
      # rendering, links, the HTML parse, search, the landing page, contrast
      # and the page budget; site.yml runs the same with Chrome
      - name: The documentation site holds what it says (without Chrome)
        run: python check_site.py --no-chrome
      # the same audits and SARIF, byte for byte, on the three x64 systems
      - name: Audit and SARIF documents, for the comparison across systems
        if: matrix.python == '3.12' && matrix.deps == 'full' && (matrix.os == 'ubuntu-latest' || matrix.os == 'windows-latest' || matrix.os == 'macos-15-intel')
        run: python check_identical.py --write identical-out
      - name: Keep them
        if: matrix.python == '3.12' && matrix.deps == 'full' && (matrix.os == 'ubuntu-latest' || matrix.os == 'windows-latest' || matrix.os == 'macos-15-intel')
        uses: actions/upload-artifact@v4
        with:
          name: identical-${{ runner.os }}
          path: identical-out
          if-no-files-found: error

  identical:
    name: the audit and SARIF are the same bytes on Linux, Windows and macOS
    needs: test
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          pattern: identical-*
          path: identical
      - name: Compare
        run: python check_identical.py --compare identical/identical-Linux identical/identical-Windows identical/identical-macOS

  lint:
    name: mypy --strict and ruff, and the complexity report
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -c requirements/ci.txt ".[full,test]" "mypy==1.18.2" "ruff==0.13.1" "types-PyYAML==6.0.12.20260906" "types-psutil==7.2.2.20260906" "types-jsonschema==4.26.0.20260518"
      - name: Lint and type-check the package and every script
        run: python check_lint.py

  # Two suites at once, from one checkout, as two local configurations run
  # side by side: every suite writes to a directory of its own
  # (suite_dirs.py), so neither may see the other's files. Each pair runs
  # the same suite twice together.
  concurrent:
    name: suites run twice at once, from one checkout
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install (full)
        run: pip install -c requirements/ci.txt ".[full,test]"
      - name: velaris-spec, for the schemas
        uses: actions/checkout@v5
        with:
          repository: gowrishankar-infra/velaris-spec
          path: velaris-spec
      - name: run_tests (native and --no-native), check_library, check_adversarial and fuzz_native, each twice at once
        shell: bash
        run: |
          python run_tests.py > run_tests-a.log 2>&1 & p1=$!
          python run_tests.py --no-native > run_tests-b.log 2>&1 & p2=$!
          python check_library.py > check_library-a.log 2>&1 & p3=$!
          python check_library.py > check_library-b.log 2>&1 & p4=$!
          python check_adversarial.py > check_adversarial-a.log 2>&1 & p5=$!
          python check_adversarial.py > check_adversarial-b.log 2>&1 & p6=$!
          python fuzz_native.py 30 > fuzz_native-a.log 2>&1 & p7=$!
          python fuzz_native.py 30 > fuzz_native-b.log 2>&1 & p8=$!
          status=0
          for pair in "run_tests-a $p1" "run_tests-b $p2" "check_library-a $p3" \
                      "check_library-b $p4" "check_adversarial-a $p5" \
                      "check_adversarial-b $p6" "fuzz_native-a $p7" "fuzz_native-b $p8"; do
            set -- $pair
            if wait "$2"; then echo "passed: $1"; else echo "::error::$1 failed"; status=1; fi
          done
          for log in *.log; do echo "===== $log"; tail -n 25 "$log"; done
          exit $status
