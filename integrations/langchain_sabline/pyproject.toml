[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "langchain-sabline"
version = "0.1.0"
description = "Run agent-written code in a box: Sabline tools for LangChain."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "Palakurthi Gowri Shankar", email = "gowrishankar@gowrishankar.dev" }]
keywords = ["langchain", "sabline", "sandbox", "agents", "code-execution"]
dependencies = ["langchain-core>=0.2", "sabline-lang>=2.57"]

[project.optional-dependencies]
proofs = ["z3-solver"]

[project.urls]
Homepage = "https://sabline.dev/"
Source = "https://github.com/gowrishankar-infra/sabline-lang"

[tool.hatch.build.targets.wheel]
packages = ["langchain_sabline"]
