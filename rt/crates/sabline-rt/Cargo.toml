[package]
name = "sabline-rt"
description = "Run code an AI wrote without handing it everything you can reach. Each function declares what it may touch. You grant the run one folder, one host or a number of calls, and the runtime refuses anything else the moment it's tried."
readme = "../../README.md"
keywords = ["sabline", "least-privilege", "sandbox", "parser", "compiler"]
categories = ["parser-implementations", "compilers"]
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true

# No dependencies. plan/9.0.md caps the default build at 25 crates and asks
# for an argument per crate; the argument for every one of them is easier to
# make when there are none. The canonical JSON writer, the Python-compatible
# `ascii()` and float forms and the command line are all in this crate,
# because each of them has to match one particular Python and a general
# library would not.
[dependencies]

# The honesty test's hook, off by default, so a released crate never
# carries its C calls or its way of standing a layer down (9.0, M4;
# src/confine_fault.rs). The suites that measure the confinement build with
# it: `cargo build --release --features fault-inject`. check_rt.py holds
# that it is here and that it is not a default.
[features]
default = []
fault-inject = []

[lints]
workspace = true

[[bin]]
name = "sabline-rt"
path = "src/bin/sabline-rt.rs"
