name: placeholders

# Publishes packaging/placeholders/pypi/sabline - the PyPI name `sabline`,
# which installs sabline-lang and holds no code - by trusted publishing.
# Run by hand, once, after PyPI has a pending publisher for the project
# `sabline` naming this repository, this file and the environment
# `placeholders` (packaging/placeholders/README.md). It publishes nothing
# else, stores no token, and a run before that publisher exists fails at the
# upload having published nothing.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pypi:
    name: the PyPI name sabline
    runs-on: ubuntu-latest
    environment: placeholders
    permissions:
      contents: read
      id-token: write            # trusted publishing, no token stored
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6
        with:
          python-version: "3.12"
      - name: Build it
        working-directory: packaging/placeholders/pypi/sabline
        run: |
          pip install build
          python -m build
          ls -l dist
      - name: Publish it
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086  # v1.14.3
        with:
          packages-dir: packaging/placeholders/pypi/sabline/dist
          skip-existing: true
