name: monthly

# The long checks, once a month (MAINTENANCE.md; items 8-11, 15, 19 and 28
# of 8.2):
#   fuzz          the parsers, JSON, CSV, py_json and the contract
#                 translator, coverage-guided (atheris) for 20 minutes
#   mutation      check_mutants.py for 90 minutes; the score goes in the run
#                 summary, and each surviving mutant becomes an issue
#   soak          sabline.Pool, 5,000 runs (check_pool_soak.py)
#   urls          every URL the documents name, and llms.txt (check_urls.py)
#   differential  the release before this one against this commit
#   sanitizers    the suites that run native code and the parsers, on a
#                 CPython built with AddressSanitizer and
#                 UndefinedBehaviorSanitizer (Linux)
#   rt_fuzz       sabline-rt under cargo-fuzz for an hour a target, and
#                 the differential fuzzer - the same generated input to
#                 both parsers - for twenty minutes (9.0.0-alpha.1)
#
# It commits nothing. Every job's token reads the repository and nothing
# more, except the report job's, which may only open issues - one per
# failed job and one per surviving mutant - through open_issues.py.

on:
  schedule:
    - cron: "41 3 1 * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fuzz:
    name: fuzzing, 20 minutes
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      # atheris publishes Linux wheels up to 3.11
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6
        with:
          python-version: "3.11"
      - name: Install, with atheris
        run: pip install -c requirements/ci.txt ".[full,test]" atheris
      - name: Fuzz
        run: python fuzz_parsers.py --minutes 20 --crashes fuzz-crashes
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        if: always()
        with:
          name: fuzz-crashes
          path: fuzz-crashes
          if-no-files-found: ignore

  rt_fuzz:
    name: sabline-rt fuzzed, and both parsers on the same input
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6
        with:
          python-version: "3.12"
      # cargo-fuzz needs nightly and a sanitizer; the fuzzing crate is
      # outside the workspace for exactly that reason.
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87  # stable
        with:
          toolchain: nightly
      - name: Install
        run: |
          pip install -c requirements/ci.txt ".[full,test]"
          cargo install cargo-fuzz --locked
      - name: The parser, on arbitrary bytes, for an hour
        working-directory: rt/crates/sabline-rt
        run: cargo fuzz run parse -- -max_total_time=3600 -rss_limit_mb=4096
      - name: The dump, on arbitrary bytes, for an hour
        working-directory: rt/crates/sabline-rt
        run: cargo fuzz run dump -- -max_total_time=3600 -rss_limit_mb=4096
      # Both parsers on the same generated input, which must answer the
      # same tree or the same code, message, fixes and line.
      - name: The differential fuzzer, 20 minutes
        run: |
          cargo build --release --manifest-path rt/Cargo.toml
          python fuzz_parsers.py --target agreement --minutes 20 --crashes rt-fuzz-crashes
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        if: always()
        with:
          name: rt-fuzz-crashes
          path: |
            rt-fuzz-crashes
            rt/crates/sabline-rt/fuzz/artifacts
          if-no-files-found: ignore

  mutation:
    name: mutation testing, 90 minutes
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6
        with:
          python-version: "3.12"
      - name: Install (full)
        run: pip install -c requirements/ci.txt ".[full,test]"
      - name: sabline-spec, for the schemas the killing suites use
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: gowrishankar-infra/sabline-spec
          path: sabline-spec
          persist-credentials: false
      - name: Mutate, run the killing suites, keep the survivors
        run: |
          python check_mutants.py --minutes 90 --json mutants.json --issues surviving
          python -c "import json; d = json.load(open('mutants.json')); print(f\"### Mutation score\n\n{d['killed']} of {d['run']} mutants killed ({d['score']}%); {d['total'] - d['run']} not run within the time\")" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        if: always()
        with:
          name: mutation
          path: |
            mutants.json
            surviving
          if-no-files-found: ignore

  soak:
    name: the worker pool, 5,000 runs
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6
        with:
          python-version: "3.12"
      - name: Install (full), and psutil to read a worker's memory
        run: pip install -c requirements/ci.txt ".[full,test]" psutil
      - name: Soak
        run: python check_pool_soak.py --runs 5000

  urls:
    name: every URL the documents name, and llms.txt
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6
        with:
          python-version: "3.12"
      - name: Ask each
        run: python check_urls.py

  differential:
    name: the previous release against this commit
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0             # the tags, to find the previous release
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6
        with:
          python-version: "3.12"
      - name: sabline-spec, for its conformance corpus
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: gowrishankar-infra/sabline-spec
          path: sabline-spec
          persist-credentials: false
      - name: Install (full)
        run: pip install -c requirements/ci.txt ".[full,test]"
      # every benchmark program here; a release runs the quick set
      - name: Every difference is one the CHANGELOG names
        run: python check_differential.py --spec sabline-spec/tests --benchmark full

  sanitizers:
    name: under AddressSanitizer and UndefinedBehaviorSanitizer (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      # leaks: CPython does not free everything at exit, by design.
      # RLIMIT_AS cannot be set under ASan, whose shadow memory is reserved
      # address space, so the check ceiling's memory cap is off here
      # (SABLINE_CHECK_CHILD) and the suites that cap memory are not run.
      ASAN_OPTIONS: detect_leaks=0:halt_on_error=1:abort_on_error=1:strict_string_checks=1
      UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
      SABLINE_CHECK_CHILD: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: CPython 3.12, from its repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: python/cpython
          ref: v3.12.11
          path: cpython
          persist-credentials: false
      - name: Build it with both sanitizers
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libssl-dev zlib1g-dev libffi-dev libbz2-dev libsqlite3-dev liblzma-dev
          cd cpython
          # CPython 3.12.11's own tokenizer (Parser/tokenizer.c:376) trips
          # UBSan's pointer-overflow check while the build freezes its
          # modules, and halt_on_error stops the build there (monthly run
          # 34978389207). That one check is left out of the build; every
          # other ASan and UBSan check stays on.
          CFLAGS="-fno-sanitize=pointer-overflow" ./configure --prefix="$RUNNER_TEMP/san" --with-address-sanitizer --with-undefined-behavior-sanitizer --without-pymalloc > configure.log 2>&1 || { tail -n 60 configure.log; exit 1; }
          make -j"$(nproc)" > make.log 2>&1 || { tail -n 100 make.log; exit 1; }
          make install > install.log 2>&1 || { tail -n 100 install.log; exit 1; }
          "$RUNNER_TEMP/san/bin/python3" -c "import sysconfig; print(sysconfig.get_config_var('CONFIG_ARGS'))"
      - name: Install Sabline into it (full)
        run: |
          "$RUNNER_TEMP/san/bin/python3" -m pip install -c requirements/ci.txt ".[full,test]"
          echo "PY=$RUNNER_TEMP/san/bin/python3" >> "$GITHUB_ENV"
      - name: Native code and the interpreter agree (random programs)
        run: $PY fuzz_native.py 300
      - name: The parsers, fuzzed (builtin engine)
        run: $PY fuzz_parsers.py 200 --engine builtin
      - name: The test suite
        run: $PY run_tests.py
      - name: Fallible builtins, Money, termination
        run: |
          $PY check_fallible.py
          $PY check_money.py
          $PY check_termination.py

  report:
    name: one issue per failed job, and one per surviving mutant
    needs: [fuzz, rt_fuzz, mutation, soak, urls, differential, sanitizers]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read              # which jobs failed, and their logs
      checks: read               # a failed job's annotations, while its log cannot be read
      issues: write              # open or comment; nothing else
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.3.0
        continue-on-error: true    # none, when the mutation job did not run
        with:
          name: mutation
          path: mutation
      - name: Open them
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          python open_issues.py jobs --workflow monthly --run-id "${{ github.run_id }}" --label monthly
          if ls mutation/surviving/*.md > /dev/null 2>&1; then
            python open_issues.py files mutation/surviving --label mutation
          fi
