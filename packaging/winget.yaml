# winget manifest, for `winget install Sabline.Sabline`.
#
# Publishing means opening a pull request against
# microsoft/winget-pkgs with these three files under
# manifests/g/Gowrishankar/Sabline/<version>/. The installer URL points
# at the Windows executable attached to each GitHub release, and the
# sha256 must match it:
#
#   Get-FileHash sabline-windows.exe -Algorithm SHA256

PackageIdentifier: Gowrishankar.Sabline
PackageVersion: 2.55.0
PackageLocale: en-US
Publisher: Palakurthi Gowri Shankar
PublisherUrl: https://github.com/gowrishankar-infra
PackageName: Sabline
PackageUrl: https://sabline.dev/
License: MIT
LicenseUrl: https://github.com/gowrishankar-infra/sabline-lang/blob/main/LICENSE
ShortDescription: A language where a signature declares its effects and machine-checked promises.
Description: |-
  Sabline is a language where a function's signature declares its types,
  the effects it may perform, whether it can fail, and promises that a
  theorem prover checks before the program runs. The runtime enforces an
  effect budget you grant on the command line, whatever the source claims
  about itself, so a program you have not read can still be run safely.
Moniker: sabline
Tags:
  - programming-language
  - compiler
  - formal-verification
  - sandbox
  - ai
Installers:
  - Architecture: x64
    InstallerType: portable
    InstallerUrl: https://github.com/gowrishankar-infra/sabline-lang/releases/download/v2.55/sabline-windows.exe
    InstallerSha256: REPLACE_WITH_THE_EXE_SHA256
    Commands:
      - sabline
ManifestType: singleton
ManifestVersion: 1.6.0
