- id: sabline-check
  name: sabline check
  description: Compile every Sabline file, and prove the promises it makes.
  entry: sabline check
  language: python
  additional_dependencies: ["sabline-lang", "z3-solver"]
  files: \.vel$
  pass_filenames: true

- id: sabline-fmt
  name: sabline fmt
  description: Check that every Sabline file is canonically formatted.
  entry: sabline fmt --check
  language: python
  additional_dependencies: ["sabline-lang"]
  files: \.vel$
  pass_filenames: true

- id: sabline-proofs
  name: sabline proofs
  description: Fail when too few promises are proven rather than checked at runtime.
  entry: sabline proofs . --min 80
  language: python
  additional_dependencies: ["sabline-lang", "z3-solver"]
  files: \.vel$
  pass_filenames: false
