name: "Velaris capability audit"
description: "Report what a repository's Velaris programs may touch and what they leave unproven, as GitHub code scanning findings."
# name and description are what the Marketplace listing shows as its title and
# tagline; the listing renders this repository's README below them. The name has
# to be unique across the whole Marketplace - "Velaris" alone was already taken
# (2.36.4) - and changing it changes the listing's URL slug. A new release has to
# be published to the Marketplace before either reaches the listing.
branding:
  icon: "shield"
  color: "green"

inputs:
  files:
    description: "Which files to check (a glob). Default: every .vel file."
    required: false
    default: ""
  version:
    description: "Which Velaris version to install. Default: the Action's own version - the tag it was used at (`@v8.1.0` installs velaris-lang 8.1.0), or, when it is pinned to a commit, the version that commit's velaris/version.py names; the newest on PyPI only if that version is not there."
    required: false
    default: ""
  proofs:
    description: "Install the theorem prover so promises are proven, not just checked (true/false)."
    required: false
    default: "true"
  format:
    description: "Also fail if the code is not canonically formatted (true/false)."
    required: false
    default: "false"
  min-proven:
    description: "Fail if fewer than this percent of promise-carrying functions are proven (e.g. 80)."
    required: false
    default: ""
  pr-comment:
    description: "On a pull_request event, post one comment holding the velaris audit of every changed .vel file, and edit that same comment on later runs (true/false). Needs pull-requests: write."
    required: false
    default: "false"
  sarif:
    description: "Write the check's findings as SARIF 2.1.0 and upload them to GitHub code scanning (true/false). Needs security-events: write. Not uploaded on a pull request from a fork, whose token cannot upload; the file is still written."
    required: false
    default: "true"
  capabilities:
    description: "The capability ratchet: 'check' holds every .vel file to the surface declared in velaris.capabilities at the repository root and fails the job if anything widened; 'off' skips it. Default: 'check' when velaris.capabilities exists, otherwise 'off' - except that a pull request which deletes the file fails, since that would turn the ratchet off. Findings go to code scanning with the check's when sarif is true."
    required: false
    default: ""
  deps-diff:
    description: "On a pull_request event, compare every dependency the pull request upgrades in a lockfile and post one comment with what each upgraded version gained, edited in place on later runs (true/false). For a Velaris library that is its declared capability surface; for any other package it is only the install-time scripts and declared dependencies, and the comment says the surface is unknown. It reads what is declared, not what code does. Informational: it does not fail the job. Needs pull-requests: write; findings go to code scanning when sarif is true."
    required: false
    default: "false"

outputs:
  sarif-file:
    description: "Where the SARIF file was written, when sarif is true and there were .vel files to check."
    value: ${{ steps.check.outputs.sarif-file }}
  capabilities-sarif-file:
    description: "Where the capability ratchet's SARIF was written, when the ratchet ran and sarif is true."
    value: ${{ steps.ratchet.outputs.sarif-file }}
  deps-diff-sarif-file:
    description: "Where deps-diff's SARIF was written, when deps-diff ran and sarif is true."
    value: ${{ steps.deps.outputs.sarif-file }}

runs:
  using: "composite"
  steps:
    - name: Install Velaris
      id: install
      shell: bash
      env:
        VERSION_INPUT: ${{ inputs.version }}
        ACTION_REF: ${{ github.action_ref }}
        ACTION_PATH: ${{ github.action_path }}
      run: |
        pkg="velaris-lang"
        pinned=""
        if [ -n "$VERSION_INPUT" ]; then
          pkg="velaris-lang==$VERSION_INPUT"
        else
          # default to the Action's own version, so the compiler and the
          # Action agree: the tag it was used at (@v8.1.0 installs 8.1.0),
          # or - pinned to a commit, as the README shows - the version that
          # commit's velaris/version.py names (velaris.py before 8.2). Only
          # when neither gives a version
          # that installs does it fall back to the newest on PyPI.
          ver="${ACTION_REF#v}"
          if ! echo "$ver" | grep -qE '^[0-9]+\.[0-9]+(\.[0-9]+)?$'; then
            ver=$(sed -n 's/^VERSION = "\([0-9.]*\)"$/\1/p' "$ACTION_PATH/velaris/version.py" "$ACTION_PATH/velaris.py" 2>/dev/null | head -n 1)
          fi
          if [ -n "$ver" ]; then
            pkg="velaris-lang==$ver"
            pinned="$ver"
          fi
        fi
        extra=""
        if [ "${{ inputs.proofs }}" = "true" ]; then
          extra="z3-solver"
        fi
        echo "installing $pkg (action ref: ${ACTION_REF:-none})"
        if ! pip install "$pkg" $extra; then
          if [ -n "$pinned" ]; then
            echo "::warning::velaris-lang $pinned, the Action's own version, did not install; installing the newest on PyPI instead"
            pip install velaris-lang $extra
          else
            exit 1
          fi
        fi
        velaris doctor

    # With sarif (the default), the check writes SARIF 2.1.0 to a file and
    # still prints each finding to the log; it fails the step exactly as
    # the plain check does. The file is uploaded by the next step.
    - name: Check
      id: check
      shell: bash
      env:
        FILES: ${{ inputs.files }}
        SARIF: ${{ inputs.sarif }}
      run: |
        files="$FILES"
        if [ -z "$files" ]; then
          files=$(find . -name '*.vel' -not -path './.git/*' | sort)
        fi
        if [ -z "$files" ]; then
          echo "no .vel files found"
          exit 0
        fi
        echo "checking $(echo "$files" | wc -w) file(s)"
        if [ "$SARIF" = "true" ]; then
          sarif="$RUNNER_TEMP/velaris.sarif"
          echo "sarif-file=$sarif" >> "$GITHUB_OUTPUT"
          velaris check $files --sarif > "$sarif"
        else
          velaris check $files
        fi

    # Runs whether the check passed or not: the findings of a failing
    # check are the ones worth reading. Skipped on a pull request from a
    # fork, where the job's token is read-only and the upload would fail.
    - name: Upload the findings to code scanning
      if: ${{ always() && steps.check.outputs.sarif-file != '' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
      uses: github/codeql-action/upload-sarif@b96794f015dfd88f77b49b1c93e0fa7110f94c63  # v4.38.0
      with:
        sarif_file: ${{ steps.check.outputs.sarif-file }}

    # The ratchet holds the tree to velaris.capabilities - the surface the
    # repository declared - and never to the previous commit, so capability
    # added over many small pull requests fails every one of them until
    # someone widens the file itself, where the change shows in review.
    # It runs whether or not the check passed: a file that does not
    # compile cannot run, and the ratchet reports it rather than failing.
    - name: Capability ratchet
      id: ratchet
      if: ${{ !cancelled() && steps.install.outcome == 'success' }}
      shell: bash
      env:
        MODE: ${{ inputs.capabilities }}
        SARIF: ${{ inputs.sarif }}
        EVENT: ${{ github.event_name }}
        BASE_SHA: ${{ github.event.pull_request.base.sha }}
      run: |
        mode="$MODE"
        if [ -z "$mode" ]; then
          if [ -f velaris.capabilities ]; then
            mode=check
          elif [ "$EVENT" = "pull_request" ] \
              && git fetch --no-tags --depth=1 origin "$BASE_SHA" >/dev/null 2>&1 \
              && git cat-file -e "$BASE_SHA:velaris.capabilities" 2>/dev/null; then
            echo "::error::this pull request deletes velaris.capabilities, which turns the capability ratchet off. If that is intended, set capabilities: off in the workflow, where the change shows in review."
            echo '{"removed": true}' > "$RUNNER_TEMP/velaris-capabilities.json"
            exit 1
          else
            mode=off
          fi
        fi
        case "$mode" in
          off)
            echo "capability ratchet: off (no velaris.capabilities; write one with: velaris capabilities init)"
            exit 0 ;;
          check) ;;
          *)
            echo "::error::capabilities is 'check' or 'off', not '$mode'"
            exit 2 ;;
        esac
        status=0
        velaris capabilities check . --json > "$RUNNER_TEMP/velaris-capabilities.json" || status=$?
        if [ "$SARIF" = "true" ]; then
          sarif="$RUNNER_TEMP/velaris-capabilities.sarif"
          echo "sarif-file=$sarif" >> "$GITHUB_OUTPUT"
          velaris capabilities check . --sarif > "$sarif" || true
        fi
        velaris capabilities check . || true
        exit $status

    - name: Upload the ratchet's findings to code scanning
      if: ${{ always() && steps.ratchet.outputs.sarif-file != '' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
      uses: github/codeql-action/upload-sarif@b96794f015dfd88f77b49b1c93e0fa7110f94c63  # v4.38.0
      with:
        sarif_file: ${{ steps.ratchet.outputs.sarif-file }}

    - name: Proven share
      if: ${{ inputs.min-proven != '' }}
      shell: bash
      run: velaris proofs . --min "${{ inputs.min-proven }}"

    - name: Formatting
      if: ${{ inputs.format == 'true' }}
      shell: bash
      env:
        FILES: ${{ inputs.files }}
      run: |
        files="$FILES"
        if [ -z "$files" ]; then
          files=$(find . -name '*.vel' -not -path './.git/*' | sort)
        fi
        velaris fmt $files --check

    # One comment per pull request, found again by the hidden marker
    # and edited in place, so a long review does not fill up with
    # audits. Runs after the checks whether they passed or not - the
    # audit of a file that does not compile is still worth reading.
    # Plain curl against the REST API; no third-party action.
    - name: Audit the changed files and comment on the pull request
      if: ${{ always() && inputs.pr-comment == 'true' && github.event_name == 'pull_request' }}
      shell: bash
      env:
        GITHUB_TOKEN: ${{ github.token }}
        API_URL: ${{ github.api_url }}
        REPO: ${{ github.repository }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        BASE_SHA: ${{ github.event.pull_request.base.sha }}
        HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        CHECKS_STATUS: ${{ job.status }}
      run: |
        set -u
        marker="<!-- velaris-audit-comment -->"

        # which .vel files the pull request changes; a shallow checkout
        # may not hold the base, so fetch it, and fall back to every file
        scope="changed"
        if git fetch --no-tags --depth=1 origin "$BASE_SHA" >/dev/null 2>&1; then
          files=$(git diff --name-only --diff-filter=AMR "$BASE_SHA" HEAD -- '*.vel' | sort)
        else
          scope="all (the base commit could not be fetched)"
          files=$(find . -name '*.vel' -not -path './.git/*' | sed 's|^\./||' | sort)
        fi
        printf '%s\n' "$files" > /tmp/velaris_changed.txt
        export SCOPE="$scope"

        # what changed since the base, as facts: the capability surface,
        # the proven share, new fallible functions, new hosts and paths,
        # and a risk word computed from those alone
        review_file=""
        if [ "$scope" = "changed" ] && velaris review --against "$BASE_SHA" --json \
            > "$RUNNER_TEMP/velaris-review.json" 2> "$RUNNER_TEMP/velaris-review.err"; then
          review_file="$RUNNER_TEMP/velaris-review.json"
        fi
        export REVIEW_FILE="$review_file"
        export RATCHET_FILE="$RUNNER_TEMP/velaris-capabilities.json"

        # the comment body, from the same audit the library gives
        python - <<'PY' > /tmp/velaris_comment.json
        import json, os, sys
        import velaris
        marker = "<!-- velaris-audit-comment -->"
        files = [f for f in open("/tmp/velaris_changed.txt").read().split("\n") if f.strip()]
        scope = os.environ.get("SCOPE", "changed")
        head = os.environ["HEAD_SHA"][:7]
        status = os.environ.get("CHECKS_STATUS", "")

        def load(name):
            path = os.environ.get(name) or ""
            try:
                return json.load(open(path)) if path and os.path.exists(path) else None
            except ValueError:
                return None

        def cell(text):
            return str(text).replace("|", "\\|").replace("\n", " ")

        ratchet, review = load("RATCHET_FILE"), load("REVIEW_FILE")
        L = [marker, f"## Velaris audit of {len(files)} changed file(s) at `{head}`", ""]
        L.append(f"Checks: **{status}**. Audit scope: {scope} `.vel` files.")
        L.append("")
        if ratchet is not None:
            L.append("### Capability ratchet")
            L.append("")
            findings = ratchet.get("findings") or []
            if ratchet.get("removed"):
                L.append("**Failed.** This pull request deletes `velaris.capabilities`, which "
                         "turns the ratchet off. If that is intended, set `capabilities: off` "
                         "in the workflow.")
            elif findings:
                L.append(f"**Failed.** The code needs more than `velaris.capabilities` declares "
                         f"({len(findings)} widening(s)), compared with the declared surface, not "
                         f"with the previous commit. If a widening is intended, make the edit "
                         f"named under it to `velaris.capabilities` in this pull request, where "
                         f"it shows in review.")
                L.append("")
                for f in findings:
                    if f["kind"] == "grant":
                        q = f["programs"][0]
                        o = (q.get("origins") or [None])[0]
                        what = (f"a new effect, `{f['effect']}`" if f["new_effect"] else
                                "not in the declared surface" if f["outside_surface"] else
                                "in the surface, not in the entry of the program that needs it")
                        text = (f"- `{f['grant']}` - {what}; needed by "
                                + ", ".join(f"`{p['file']}`" for p in f["programs"]))
                        if o:
                            text += (f"; introduced at `{o['file']}:{o['line']}` in `{o['function']}`"
                                     + (f" (`{o['call']}`)" if o.get("call") else ""))
                        if q.get("reached_from"):
                            text += ", reached from " + " -> ".join(f"`{n}`" for n in q["reached_from"])
                    elif f["kind"] == "count":
                        now = "no bound" if f["current"] is None else f"at most {f['current']}"
                        allows = f["surface_allows"] if f["outside_surface"] else f["entry_allows"]
                        text = (f"- `{f['file']}`: {now} {f['effect']} operations in a run; the "
                                f"baseline allows {allows}" + (f" - {f['why']}" if f.get("why") else ""))
                    else:
                        text = (f"- `{f['file']}`: `{f['function']}` gained "
                                + ", ".join(f"`{e}`" for e in f["gained"])
                                + " - " + "; ".join(f["because"]))
                    L.append(text)
                    L.append("  - if intended: " + "; ".join(f["accept"]))
            else:
                L.append("Passed: nothing needs more than `velaris.capabilities` declares.")
            for w in ratchet.get("warnings") or []:
                L.append("")
                L.append(f"> {w}")
            L.append("")
        if review is not None:
            ps = review["proven_share"]
            share = lambda v: "no promises" if v is None else f"{v:g}%"
            d = review.get("declared") or {}
            declared = ("removed - the ratchet is off" if d.get("removed") else
                        "added" if d.get("added") else
                        "; ".join([f"+ `{w}`" for w in d.get("widened", [])]
                                  + [f"- `{n}`" for n in d.get("narrowed", [])]) or "unchanged")
            paths = ([f"`{p}` (read)" for p in review["new_paths"]["read"]]
                     + [f"`{p}` (write)" for p in review["new_paths"]["write"]])
            L.append(f"### Review against the base `{review['commit'][:7]}`")
            L.append("")
            L.append("| | |")
            L.append("|---|---|")
            L.append(f"| risk | **{review['risk']}** |")
            L.append(f"| capability surface | {review['surface']['change']} |")
            L.append(f"| proven share | {share(ps['before'])} -> {share(ps['after'])}"
                     + (" (fell)" if ps["fell"] else "")
                     + ("" if review.get("prover") else " (no prover: every promise counts as checked at runtime)")
                     + " |")
            L.append("| new fallible functions | " + (cell(", ".join(
                f"`{x['file']}`: `{x['function']}`" for x in review["new_fallible"])) or "none") + " |")
            L.append("| new hosts | " + (cell(", ".join(f"`{h}`" for h in review["new_hosts"])) or "none") + " |")
            L.append("| new paths | " + (cell(", ".join(paths)) or "none") + " |")
            L.append("| new Python modules | " + (cell(", ".join(f"`{m}`" for m in review["new_modules"])) or "none") + " |")
            L.append(f"| velaris.capabilities | {cell(declared)} |")
            L.append("")
            for why in review.get("risk_because") or []:
                L.append(f"- {why}")
            if not review.get("risk_because"):
                L.append("Low: nothing widened and the proven share did not fall.")
            L.append("")
        if not files:
            L.append("No `.vel` files changed in this pull request.")
        for f in files:
            try:
                src = open(f, encoding="utf-8").read()
                a = velaris.audit(src, path=f)
            except Exception as e:  # the audit must never break the job
                L.append(f"### `{f}`\n\ncould not audit: {type(e).__name__}: {e}\n")
                continue
            L.append(f"### `{f}`")
            L.append("")
            if not a.ok:
                L.append(f"**Does not compile** ({len(a.problems)} problem(s)):")
                for p in a.problems[:5]:
                    L.append(f"- line {p.line}: `{p.code}` {p.message}")
                L.append("")
            effects = ", ".join(a.effects) if a.effects else "none"
            if a.ffi_modules:
                effects += " (python modules: " + ", ".join(a.ffi_modules) + ")"
            share = "no promises" if a.proven_share is None else f"{a.proven_share:g}% proven"
            L.append("| | |")
            L.append("|---|---|")
            L.append(f"| effects | {effects} |")
            L.append(f"| promises | {share} |")
            L.append(f"| safe command | `{a.safe_command.replace('<file>', f)}` |")
            for w in a.warnings:
                L.append(f"| warning | {w} |")
            L.append("")
        L.append("<sub>Posted by the Velaris action; this comment is edited in place on later runs.</sub>")
        json.dump({"body": "\n".join(L)}, sys.stdout)
        PY

        auth=(-H "Authorization: Bearer $GITHUB_TOKEN" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28")

        # find our earlier comment, if any, by the marker (up to 1000
        # comments back; the python prints the id, or "next" when a full
        # page came back without it, or nothing)
        comment_id=""
        page=1
        while [ "$page" -le 10 ]; do
          curl -sS "${auth[@]}" \
            "$API_URL/repos/$REPO/issues/$PR_NUMBER/comments?per_page=100&page=$page" \
            > /tmp/velaris_comments.json
          found=$(MARKER="$marker" python - <<'PY'
        import json, os
        marker = os.environ["MARKER"]
        data = json.load(open("/tmp/velaris_comments.json"))
        hit = next((c["id"] for c in data if marker in (c.get("body") or "")), None)
        print(hit if hit is not None else ("next" if len(data) == 100 else ""))
        PY
        )
          if [ "$found" = "next" ]; then
            page=$((page + 1))
          else
            comment_id="$found"
            break
          fi
        done

        if [ -n "$comment_id" ]; then
          echo "editing comment $comment_id"
          curl -sS -o /dev/null -w "%{http_code}\n" "${auth[@]}" -X PATCH \
            "$API_URL/repos/$REPO/issues/comments/$comment_id" \
            --data @/tmp/velaris_comment.json
        else
          echo "posting a new comment"
          curl -sS -o /dev/null -w "%{http_code}\n" "${auth[@]}" -X POST \
            "$API_URL/repos/$REPO/issues/$PR_NUMBER/comments" \
            --data @/tmp/velaris_comment.json
        fi

    # What each dependency a pull request upgrades gained between its two
    # versions (velaris deps-diff). The comparison runs once and is saved;
    # the log, the SARIF and the comment are all rendered from that file,
    # so the registries are read once. The comment is its own - a second
    # marker - and is edited in place like the audit's. It informs and
    # never fails the job: for most packages the honest answer is that
    # the capability surface is unknown, and a gate on that would be a
    # gate on nothing.
    - name: What each upgraded dependency gained
      id: deps
      if: ${{ !cancelled() && inputs.deps-diff == 'true' && github.event_name == 'pull_request' && steps.install.outcome == 'success' }}
      shell: bash
      env:
        GITHUB_TOKEN: ${{ github.token }}
        BASE_SHA: ${{ github.event.pull_request.base.sha }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        SARIF: ${{ inputs.sarif }}
      run: |
        if ! git fetch --no-tags --depth=1 origin "$BASE_SHA" >/dev/null 2>&1; then
          echo "::warning::deps-diff: the base commit could not be fetched, so no lockfile was compared"
          exit 0
        fi
        saved="$RUNNER_TEMP/velaris-deps.json"
        status=0
        velaris deps-diff --against "$BASE_SHA" --json > "$saved" || status=$?
        if [ "$status" = "2" ]; then
          echo "::warning::deps-diff could not compare the lockfiles"
          exit 0
        fi
        velaris deps-diff --from "$saved" || true
        if [ "$SARIF" = "true" ]; then
          sarif="$RUNNER_TEMP/velaris-deps.sarif"
          velaris deps-diff --from "$saved" --sarif > "$sarif" || true
          echo "sarif-file=$sarif" >> "$GITHUB_OUTPUT"
        fi
        if ! velaris deps-diff --from "$saved" --comment --pr "$PR_NUMBER"; then
          echo "::warning::deps-diff could not post its comment (a pull request from a fork has a read-only token)"
        fi
        exit 0

    - name: Upload deps-diff's findings to code scanning
      if: ${{ always() && steps.deps.outputs.sarif-file != '' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
      uses: github/codeql-action/upload-sarif@b96794f015dfd88f77b49b1c93e0fa7110f94c63  # v4.38.0
      with:
        sarif_file: ${{ steps.deps.outputs.sarif-file }}
