name: tests

on:
  push:
    branches: [main]
  pull_request:
  # release.yml, once it has pushed the pin move (8.4): a push made with
  # GITHUB_TOKEN starts nothing by itself
  workflow_dispatch:

# What runs where, and where to look when something is red: MAINTENANCE.md.

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }} / ${{ matrix.deps }}
    # Python 3.14 is run and reported, and allowed to fail: a red 3.14 leg
    # does not fail the run, so it does not hold up a release (8.2)
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        # x64 on all three systems, both Pythons, with and without the
        # optional dependencies: twelve legs
        os: [ubuntu-latest, windows-latest, macos-15-intel]
        python: ["3.10", "3.12"]
        deps: [full, minimal]
        experimental: [false]
        # arm64 on Linux and macOS, and Python 3.14: six more (8.2)
        include:
          - {os: ubuntu-24.04-arm, python: "3.12", deps: full, experimental: false}
          - {os: ubuntu-24.04-arm, python: "3.12", deps: minimal, experimental: false}
          - {os: macos-latest, python: "3.12", deps: full, experimental: false}
          - {os: macos-latest, python: "3.12", deps: minimal, experimental: false}
          - {os: ubuntu-latest, python: "3.14", deps: full, experimental: true}
          - {os: ubuntu-latest, python: "3.14", deps: minimal, experimental: true}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          allow-prereleases: true
      # [test] is what the suites need and Sabline does not: jsonschema,
      # fastapi and httpx, pyyaml, hypothesis
      - name: Install (full - with Z3 proofs and LLVM native)
        if: matrix.deps == 'full'
        run: pip install -c requirements/ci.txt ".[full,test]"
      - name: Install (minimal - runtime checks, interpreted)
        if: matrix.deps == 'minimal'
        run: pip install -c requirements/ci.txt ".[test]"
      - name: Version
        run: sabline --version
      # sabline-rt on every leg of the matrix, including arm64 and Windows.
      # The agreement gate and the differential fuzzer both need it, and
      # neither has a path that skips when it is missing, so it is built
      # here rather than by them.
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87  # stable
        with:
          toolchain: stable
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6  # v2
        with:
          workspaces: rt
          key: ${{ matrix.python }}-${{ matrix.deps }}
      - name: Build sabline-rt
        run: cargo build --release --manifest-path rt/Cargo.toml
      - name: sabline-rt's own tests
        run: cargo test --manifest-path rt/Cargo.toml --release
      - name: clippy, with every warning an error
        run: cargo clippy --manifest-path rt/Cargo.toml --all-targets --release -- -D warnings
      - name: rustfmt
        run: cargo fmt --manifest-path rt/Cargo.toml --check
      - name: The crate holds its own rules (no unsafe, the MSRV, the cap)
        run: python check_rt.py
      # sabline-spec: its conformance corpus, and the schemas the library
      # suite holds audits and attestations to. It holds no .vel file, so
      # the capability check below still sees this repository alone.
      - name: sabline-spec, for its corpus and schemas
        uses: actions/checkout@v5
        with:
          repository: gowrishankar-infra/sabline-spec
          path: sabline-spec
      # OPA, so check_policies.py runs `opa test` and `opa eval` rather than
      # skipping them
      - name: OPA, for the policy's tests
        uses: open-policy-agent/setup-opa@b2b258e089860efaadaaf71bf6e3aecb4a3eeff1  # v2.4.0
        with:
          version: "1.20.2"
      # The agreement gate: both parsers over every Sabline source this
      # project has, failing on any difference in the tree, the error code,
      # the message, the fixes or the line. It has no `if:`, no
      # `continue-on-error` and no flag that skips a corpus, and
      # check_workflows.py fails on a pull request that gives it one.
      - name: Both runtimes agree, program for program
        run: python check_agreement.py sabline-spec/tests
      - name: Test suite
        run: python run_tests.py
      - name: Each stage on its own (unit tests, and the modules' pipeline order)
        run: python run_unit_tests.py
      - name: The operating system holds the budget too, and says truthfully how much (8.4)
        run: python check_confine.py
      - name: Native and interpreted agree (random programs)
        run: python fuzz_native.py 60
      - name: The parsers, JSON, CSV, py_json and the contract translator, fuzzed (30 each)
        run: python fuzz_parsers.py 30
      - name: How much is proven
        run: sabline proofs examples stdlib || true
      - name: The library and MCP server keep the same guarantees
        run: python check_library.py
      - name: What the library, the command line, the doors and the Action offer, held to a golden
        run: python check_api.py
      - name: Every command answers --help; stats --ffi; z3 and llvmlite imported only when used
        run: python check_cli.py
      - name: Every error code's message, held to a golden
        run: python check_error_messages.py
      - name: The release gate, the kill switch and a release that fails midway
        run: python check_release.py
      - name: The scheduled workflows report and change nothing; open_issues.py and adversarial_models.py
        run: python check_workflows.py
      - name: The nightly's probes, each against a local install; a program that is not there is one BROKEN line
        run: python check_nightly.py
      - name: Every fallible builtin is enforced
        run: python check_fallible.py
      - name: Amounts are exact, in one currency, and round only where named
        run: python check_money.py
      - name: The sandbox cannot be escaped
        run: python check_sandbox.py
      - name: A Secret reaches nothing that emits it
        run: python check_secret.py
      - name: A worker pool leaks nothing between programs
        run: python check_pool.py
      - name: The reference platform refuses what it says it refuses
        run: python check_platform.py
      - name: An ejected program runs with nothing from here, and holds its budget
        run: python check_eject.py
      - name: sabline eval holds its profile, and refuses every relaxation
        run: python check_eval.py
      - name: receipts diff names each difference; replay runs the same bytes or refuses
        run: python check_receipts.py
      - name: sabline demo, end to end, and that it reads nobody's .env (8.5)
        run: python check_demo.py
      - name: azure.vel, github.vel, k8s.vel and aws.vel, each against a stand-in for its service (8.5)
        run: python check_batteries.py
      - name: sha256, the encoders, and an HMAC whose key is a Secret and whose MAC is all that leaves (8.5)
        run: python check_digests.py
      - name: A tool call passes the manifest, the budget and the ceiling, or the host never hears of it (8.5)
        run: python check_runner.py
      - name: A receipt and an audit as a page, the same bytes for the same input (8.5)
        run: python check_viewers.py
      - name: Everything the rename kept working still works, and no old name has drifted back (8.6)
        run: python check_rename.py
      - name: Every STOPPED incident still refuses and every PARTIAL behaves as its entry says
        run: python check_incidents.py
      - name: The milestone table and the CHANGELOG agree, and the check is shown to fail
        run: python check_plan.py
      - name: A false promise the prover left to runtime is caught by a witness; effects are refused
        run: python check_from_contracts.py
      - name: What docs/structurally-impossible.md says cannot occur, tried
        run: python check_impossible.py
      - name: The OPA policy and its Kyverno twin ask what they say
        run: python check_policies.py
      - name: Every loop gets the termination verdict it must
        run: python check_termination.py
      - name: Every widening of the capability surface fails, and nothing else does
        run: python check_ratchet.py
      - name: An upgrade's gained surface is reported, and unknown is said to be unknown
        run: python check_deps.py
      - name: A widened workflow permission fails, and nothing else does
        run: python check_permissions.py
      - name: Every mutant the monthly run left alive in a guarantee's lines is killed by a test
        run: python check_mutant_kills.py
      - name: This repository needs nothing its sabline.capabilities does not declare
        run: sabline capabilities check .
      - name: sabline-spec's corpus is what these suites say (drift test)
        run: python build_conformance.py --check sabline-spec/tests
      - name: Conformant at L1, L2 and L3 against sabline-spec's corpus
        run: sabline conformance --corpus sabline-spec/tests
      - name: Benchmark harness (one program per category; Deno rows may be absent)
        if: matrix.deps == 'full'
        run: python benchmark/run.py --quick --check
      - name: Wrong programs are refused for the right reason
        run: python check_refusals.py
      - name: Every adversarial pass stays closed
        run: python check_adversarial.py
      - name: A lie is never proven, under five Z3 seeds (Goal A corpus)
        run: python check_prover_lies.py
      - name: The audit is unchanged by shape, and moves only with an effect
        run: python check_metamorphic.py
      - name: Hostile resources end in a coded error, never a traceback
        run: python check_hostile.py
      - name: Nothing a program or its surroundings control widens its budget or its audit
        run: python check_self_budget.py
      - name: Properties over generated programs (formatter, check, audit against the run)
        run: python check_properties.py
      - name: The documents are true (code blocks run, commands run, counts and codes match)
        run: python check_docs.py
      # the ten tasks with their recorded replies: no model and no network;
      # with a key the same command asks the model (agent_loop.py)
      - name: The model round trip, replayed (agent_loop.py --metric --offline)
        run: python agent_loop.py --metric --offline
      - name: Edge, property and round-trip tests
        run: sabline examples/edges.vel --allow ffi:datetime,io
      - name: Sabline tests written in Sabline
        run: sabline test examples/std_test.vel
      - name: Compile check (every example compiles)
        run: sabline check examples/*.vel examples/lib/*.vel stdlib/*.vel || true
      - name: Formatter check (repo is canonically formatted)
        shell: bash
        run: sabline fmt examples/*.vel examples/lib/*.vel stdlib/*.vel --check
      # before the build, which writes over the committed page: every step
      # after this one sees a fresh playground, so this is the only place
      # the committed one (and docs/playground.html, which sabline.dev
      # serves) is held to the package
      - name: The committed playground is the one this package builds
        run: python build_playground.py --check
      - name: Playground builds
        run: python build_playground.py
      - name: Docs site builds
        run: python build_docs.py
      # rendering, links, the HTML parse, search, the landing page, contrast
      # and the page budget; site.yml runs the same with Chrome
      - name: The documentation site holds what it says (without Chrome)
        run: python check_site.py --no-chrome
      # the same audits and SARIF, byte for byte, on the three x64 systems
      - name: Audit and SARIF documents, for the comparison across systems
        if: matrix.python == '3.12' && matrix.deps == 'full' && (matrix.os == 'ubuntu-latest' || matrix.os == 'windows-latest' || matrix.os == 'macos-15-intel')
        run: python check_identical.py --write identical-out
      - name: Keep them
        if: matrix.python == '3.12' && matrix.deps == 'full' && (matrix.os == 'ubuntu-latest' || matrix.os == 'windows-latest' || matrix.os == 'macos-15-intel')
        uses: actions/upload-artifact@v4
        with:
          name: identical-${{ runner.os }}
          path: identical-out
          if-no-files-found: error

  agreement:
    name: both runtimes agree, and the gate that says so cannot be turned off
    # No `if:`, no `continue-on-error`, and nothing here reads a variable
    # that could narrow what is compared. check_workflows.py holds this
    # job to that shape, so a pull request that weakens it fails on itself.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87  # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6  # v2
        with:
          workspaces: rt
          key: agreement
      - name: Install
        run: pip install -c requirements/ci.txt ".[full,test]"
      - name: sabline-spec, for its corpus
        uses: actions/checkout@v5
        with:
          repository: gowrishankar-infra/sabline-spec
          path: sabline-spec
      - name: Build sabline-rt
        run: cargo build --release --manifest-path rt/Cargo.toml
      - name: Both runtimes agree, program for program
        run: python check_agreement.py sabline-spec/tests
      # Three differences injected into sabline-rt, one per comparison
      # class, each of which the gate must go red for; and the scan that
      # says the gate reads nothing that could disable it.
      - name: The gate cannot be turned off, and it detects
        run: python check_gate.py sabline-spec/tests
      # Both parsers on generated input, briefly. monthly.yml runs it for
      # twenty minutes and cargo-fuzz for an hour.
      - name: The same generated input to both parsers
        run: python fuzz_parsers.py --target agreement --minutes 2

  msrv:
    name: sabline-rt builds on the Rust version it says it needs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # The number here is rt/Cargo.toml's rust-version, and check_rt.py
      # fails when the two disagree.
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87  # stable
        with:
          toolchain: "1.82"
      - name: Build and test on the minimum
        run: |
          cargo build --manifest-path rt/Cargo.toml --locked
          cargo test --manifest-path rt/Cargo.toml --locked

  supply_chain:
    name: cargo-deny - advisories, licenses, bans and sources
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87  # stable
        with:
          toolchain: stable
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25  # v2
        with:
          manifest-path: rt/Cargo.toml
          command: check
          arguments: --all-features

  rt_fuzz:
    name: sabline-rt, fuzzed - no input is a panic
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # cargo-fuzz needs nightly and a sanitizer; the fuzzing crate is
      # outside the workspace for exactly that reason.
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87  # stable
        with:
          toolchain: nightly
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6  # v2
        with:
          workspaces: rt/crates/sabline-rt/fuzz
          key: fuzz
      - name: cargo-fuzz
        run: cargo install cargo-fuzz --locked
      - name: The parser, on arbitrary bytes
        working-directory: rt/crates/sabline-rt
        run: cargo fuzz run parse -- -max_total_time=60 -rss_limit_mb=4096
      - name: The dump, on arbitrary bytes
        working-directory: rt/crates/sabline-rt
        run: cargo fuzz run dump -- -max_total_time=60 -rss_limit_mb=4096

  identical:
    name: the audit and SARIF are the same bytes on Linux, Windows and macOS
    needs: test
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          pattern: identical-*
          path: identical
      - name: Compare
        run: python check_identical.py --compare identical/identical-Linux identical/identical-Windows identical/identical-macOS

  lint:
    name: mypy --strict and ruff, and the complexity report
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -c requirements/ci.txt ".[full,test]" "mypy==1.18.2" "ruff==0.13.1" "types-PyYAML==6.0.12.20260906" "types-psutil==7.2.2.20260906" "types-jsonschema==4.26.0.20260518"
      - name: Lint and type-check the package and every script
        run: python check_lint.py

  # AgentDojo, with Sabline in the loop, offline and at no cost (plan/8.7.md).
  # It pins one AgentDojo version, replaces the agent with AgentDojo's own
  # ground truth, and re-derives every number in evals/agentdojo/results.json.
  # No model, no API key: the agent-writes-the-program half is behind a flag,
  # off by default, and is not run here.
  agentdojo:
    name: AgentDojo, with Sabline in the loop, offline
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install pinned AgentDojo (no model, no key)
        run: pip install -r requirements/agentdojo.txt
      - name: The recorded score re-derives, program for program
        run: python agentdojo_eval.py --check
      - name: The published page is what the record says
        run: python build_agentdojo_page.py --check

  # The model round trip against Python (plan/8.7.md section 2): every reply
  # a model gave, recorded in evals/roundtrip/recordings, compiled, run and
  # checked again, in both languages, and held to evals/roundtrip/results.json.
  # No model and no key here: asking one is --live, which refuses to run
  # under CI.
  roundtrip:
    name: the model round trip, replayed from its recordings
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install the prover, as the recording machine had it
        run: pip install -c requirements/ci.txt z3-solver llvmlite
      - name: --check goes red when a verdict moves
        run: python roundtrip_eval.py --self-test
      - name: Every attempt re-derives, and the page is what the record says
        run: python roundtrip_eval.py --check

  # The competitor scoring (plan/8.7.md section 3): the benchmark's programs
  # under Deno, WASI (CPython under wasmtime), Starlark (starlark-go), a
  # Python sandbox (smolagents) and CaMeL's reference interpreter, each in
  # its own pinned runtime, beside Sabline and plain Python. Every cell of
  # benchmark/competitors/results.json - verdict and evidence line - is
  # re-derived, and one that moved fails the job. Free: public downloads
  # checked by SHA-256, pinned packages, no key and no model.
  competitors:
    name: competitors scored on the benchmark, every cell re-derived
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version-file: benchmark/competitors/hosts/starlark/go.mod
          cache: false
      - name: Install the prover, and the competitors as pinned (no key, no model)
        run: |
          pip install -c requirements/ci.txt z3-solver llvmlite
          pip install -r requirements/competitors.txt
      - name: Fetch wasmtime, CPython's WASI build and Deno, each checked by SHA-256, and build the Starlark host
        run: python benchmark/competitors/fetch_runtimes.py
      - name: The comparison and the page's claim checks go red when a number moves
        run: |
          python benchmark/compete.py --self-test
          python build_competitors_page.py --self-test
      - name: Every cell re-derives, program for program and tool for tool
        run: python benchmark/compete.py --check
      - name: The published page is what the record says
        run: python build_competitors_page.py --check

  # Two suites at once, from one checkout, as two local configurations run
  # side by side: every suite writes to a directory of its own
  # (suite_dirs.py), so neither may see the other's files. Each pair runs
  # the same suite twice together.
  concurrent:
    name: suites run twice at once, from one checkout
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install (full)
        run: pip install -c requirements/ci.txt ".[full,test]"
      - name: sabline-spec, for the schemas
        uses: actions/checkout@v5
        with:
          repository: gowrishankar-infra/sabline-spec
          path: sabline-spec
      - name: run_tests (native and --no-native), check_library, check_adversarial and fuzz_native, each twice at once
        shell: bash
        run: |
          python run_tests.py > run_tests-a.log 2>&1 & p1=$!
          python run_tests.py --no-native > run_tests-b.log 2>&1 & p2=$!
          python check_library.py > check_library-a.log 2>&1 & p3=$!
          python check_library.py > check_library-b.log 2>&1 & p4=$!
          python check_adversarial.py > check_adversarial-a.log 2>&1 & p5=$!
          python check_adversarial.py > check_adversarial-b.log 2>&1 & p6=$!
          python fuzz_native.py 30 > fuzz_native-a.log 2>&1 & p7=$!
          python fuzz_native.py 30 > fuzz_native-b.log 2>&1 & p8=$!
          status=0
          for pair in "run_tests-a $p1" "run_tests-b $p2" "check_library-a $p3" \
                      "check_library-b $p4" "check_adversarial-a $p5" \
                      "check_adversarial-b $p6" "fuzz_native-a $p7" "fuzz_native-b $p8"; do
            set -- $pair
            if wait "$2"; then echo "passed: $1"; else echo "::error::$1 failed"; status=1; fi
          done
          for log in *.log; do echo "===== $log"; tail -n 25 "$log"; done
          exit $status
