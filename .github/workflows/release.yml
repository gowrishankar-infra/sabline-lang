name: release

# A release of Sabline is made by this workflow and by nothing else.
# RELEASING.md is the long form. In short:
#
#   1. It starts when the tests workflow (test.yml, named "tests")
#      completes on a push to main with every leg passed. Nothing else
#      starts a release: no trigger here listens for tags, and GitHub
#      starts no workflow for the tag this one pushes.
#   2. The gate asks release_checks.py whether that commit is a release:
#      sabline/version.py's VERSION is newer than every tag, CHANGELOG.md
#      has an entry heading for it, all six version files agree, and a
#      minor or patch release that adds an error code, removes a flag or
#      changes a default says so on a compatibility: line. If not, it
#      says why in one line and the run ends green having done nothing,
#      which is what an ordinary push to main looks like here.
#   3. A release is only ever the commit the tests passed on. If main
#      moved while they ran, the gate refuses; the newer commit's own
#      test run decides.
#   4. Everything is built, signed and verified first. Only then is the
#      commit tagged: annotated, not signed (RELEASING.md says why).
#   5. Then it publishes, in this order, each step skipping with a notice
#      what is already there: PyPI and npm (OIDC trusted publishing, no
#      token stored for either), the VS Code Marketplace, the GitHub
#      release, the MCP registry (GitHub OIDC), the attestation.
#   6. Last, PyPI, npm, the registry and the GitHub release must all
#      report this version, or the run fails and says which does not.
#   7. An advisory-*.md the release adds becomes the request for a draft
#      security advisory, and the gh commands that make it are printed:
#      GITHUB_TOKEN cannot be given that permission. Nothing here ever
#      publishes an advisory.
#   8. A PRE-RELEASE is a different thing and publishes a different set.
#      When rt/Cargo.toml's version is X.Y.Z-alpha.N (or beta, or rc), the
#      gate says `prerelease=true` and only two jobs publish: the crate to
#      crates.io by OIDC trusted publishing, and a GitHub release marked
#      pre-release carrying the packaged crate. PyPI, npm, the VS Code
#      Marketplace and the MCP registry are not touched; the Action pins
#      are not moved; no "latest" moves anywhere. The newest release stays
#      what a user gets. Every job of the ordinary path carries
#      `needs.gate.outputs.prerelease != 'true'` for exactly that reason,
#      and check_release.py holds both paths to fixtures (plan/9.0.md).
#
# Every artifact is signed with sigstore (keyless, through this
# workflow's OIDC identity), the wheel is built twice and compared, and a
# CycloneDX SBOM travels with the release, as do a signed manifest of the
# MCP server's tools (sabline mcp-verify) and a signed in-toto
# attestation of one example program (sabline attest). A workflow_run
# runs on main, so from 7.2.0 that identity is release.yml@refs/heads/main
# and the certificate also names the commit and the workflow_run trigger;
# SECURITY.md says how to verify. Every third-party action is pinned to a
# commit; the tag it was resolved from is in the comment beside it.
#
# Run by hand (workflow_dispatch), on any branch, it is a dry run: the
# gate says what it would decide, and everything is built, signed and
# verified under that branch's identity. Nothing is tagged or published.

on:
  workflow_run:
    workflows: [tests]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# one release at a time; a dry run never waits behind one
concurrency:
  group: ${{ github.event_name == 'workflow_run' && 'release' || format('dry-run-{0}', github.run_id) }}
  cancel-in-progress: false

jobs:
  gate:
    name: is this commit a release?
    # a push to main whose tests all passed - not a pull request whose
    # branch happens to be called main, and not a fork's
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.gate.outputs.release }}
      build: ${{ steps.gate.outputs.build }}
      prerelease: ${{ steps.gate.outputs.prerelease }}
      version: ${{ steps.gate.outputs.version }}
      tag: ${{ steps.gate.outputs.tag }}
      previous_tag: ${{ steps.gate.outputs.previous_tag }}
      sha: ${{ steps.gate.outputs.sha }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5
        with:
          fetch-depth: 0             # every tag, to find the newest
          persist-credentials: false
      - name: The gate's own logic, held to its fixtures
        run: python3 check_release.py
      - name: The gate
        id: gate
        env:
          TESTED: ${{ github.event.workflow_run.head_sha || github.sha }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          if [ "$DRY_RUN" = true ]; then dry=--dry-run; else dry=; fi
          python3 release_checks.py gate $dry --expect-sha "$TESTED" \
            --annotate --github-output "$GITHUB_OUTPUT" \
            --summary "$GITHUB_STEP_SUMMARY"

  # ---- build, sign and verify everything; publish nothing ------------------

  dist:
    name: wheel and sdist, signed, with SBOM
    needs: gate
    if: needs.gate.outputs.build == 'true' && needs.gate.outputs.prerelease != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write            # sigstore keyless signing
    env:
      V: ${{ needs.gate.outputs.version }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5
        with:
          ref: ${{ needs.gate.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6
        with:
          python-version: "3.12"
      - name: Build the distribution
        run: |
          pip install build
          SOURCE_DATE_EPOCH=$(git log -1 --format=%ct) python -m build
          ls -l dist
      - name: Generate the SBOM (CycloneDX)
        run: |
          pip install cyclonedx-bom
          python -m venv sbom-env
          sbom-env/bin/pip install "$(ls dist/*.whl)[full]"
          cyclonedx-py environment --of JSON \
            --mc-type application \
            -o "dist/sabline-lang-$V.cdx.json" \
            sbom-env/bin/python
          python -c "import json,sys; d=json.load(open(sys.argv[1])); print(d['bomFormat'], d['specVersion'], len(d.get('components', [])), 'components')" \
            "dist/sabline-lang-$V.cdx.json"
      # Every MCP tool's name, description hash and input-schema hash,
      # asked of the server inside the wheel this run publishes - the
      # server a client will run - so what is signed is what ships.
      - name: The MCP tool manifest, from the server in the wheel
        run: |
          python -m venv mcp-env
          mcp-env/bin/pip install "$(ls dist/*.whl)"
          mcp-env/bin/sabline mcp-manifest \
            -o "dist/sabline-mcp-tools-$V.json" \
            -- mcp-env/bin/python -m sabline_mcp
          cat "dist/sabline-mcp-tools-$V.json"
      - name: Sign the wheel, the sdist, the SBOM and the tool manifest (sigstore)
        uses: sigstore/gh-action-sigstore-python@790bc6befb9d733738f18d8f895854b453640ec9  # v3.5.0
        with:
          inputs: |
            ./dist/*.whl
            ./dist/*.tar.gz
            ./dist/*.cdx.json
            ./dist/sabline-mcp-tools-*.json
      # The check a client operator runs, with the real signature: every
      # tool of the wheel's server must match it. On a release it runs
      # exactly as a user would, with the identity mcp-verify expects by
      # default; a dry run is signed as its branch, and names that.
      - name: Check the signed manifest against the server in the wheel
        run: |
          mcp-env/bin/pip install sigstore
          if [ "$GITHUB_EVENT_NAME" = workflow_run ]; then
            mcp-env/bin/sabline mcp-verify "dist/sabline-mcp-tools-$V.json" \
              -- mcp-env/bin/python -m sabline_mcp
          else
            mcp-env/bin/sabline mcp-verify "dist/sabline-mcp-tools-$V.json" \
              --identity "https://github.com/$GITHUB_REPOSITORY/.github/workflows/release.yml@$GITHUB_REF" \
              -- mcp-env/bin/python -m sabline_mcp
          fi
      - name: Checksums
        run: |
          cd dist
          sha256sum *.whl *.tar.gz *.cdx.json sabline-mcp-tools-*.json > SHA256SUMS
          cat SHA256SUMS
      - name: Keep what PyPI gets
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: pypi-dist
          path: |
            dist/*.whl
            dist/*.tar.gz
          if-no-files-found: error
      - name: Keep what the GitHub release gets
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: release-dist
          path: |
            dist/*.whl
            dist/*.tar.gz
            dist/*.cdx.json
            dist/sabline-mcp-tools-*.json
            dist/*.sigstore.json
            dist/SHA256SUMS
          if-no-files-found: error

  reproducible:
    name: the wheel builds the same twice
    needs: gate
    if: needs.gate.outputs.build == 'true' && needs.gate.outputs.prerelease != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5
        with:
          ref: ${{ needs.gate.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6
        with:
          python-version: "3.12"
      - name: Build twice with the same SOURCE_DATE_EPOCH and compare
        run: |
          pip install build
          export SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)
          echo "SOURCE_DATE_EPOCH=$SOURCE_DATE_EPOCH"
          python -m build --wheel --outdir build1
          rm -rf build          # hatchling's intermediate directory
          python -m build --wheel --outdir build2
          a=$(ls build1/*.whl); b=$(ls build2/*.whl)
          sha256sum "$a" "$b"
          if cmp -s "$a" "$b"; then
            echo "reproducible: both builds are byte-identical"
            echo "wheel sha256: $(sha256sum "$a" | cut -d' ' -f1)" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "NOT reproducible: the two wheels differ"
            diff <(unzip -l "$a") <(unzip -l "$b") || true
            exit 1
          fi

  bundle:
    name: the double-click bundle, signed
    needs: gate
    if: needs.gate.outputs.build == 'true' && needs.gate.outputs.prerelease != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5
        with:
          ref: ${{ needs.gate.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6
        with:
          python-version: "3.12"
      - run: python build_mcpb.py
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6  # v4.1.2
      - name: Sign sabline.mcpb (cosign, keyless)
        run: |
          cosign sign-blob --yes sabline.mcpb \
            --output-signature sabline.mcpb.sig \
            --output-certificate sabline.mcpb.pem \
            --bundle sabline.mcpb.sigstore.json
          sha256sum sabline.mcpb > sabline.mcpb.sha256
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: bundle
          path: sabline.mcpb*
          if-no-files-found: error

  binaries:
    name: standalone executable, signed
    needs: gate
    if: needs.gate.outputs.build == 'true' && needs.gate.outputs.prerelease != 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            asset: sabline-windows.exe
            sep: ";"
          - os: ubuntu-latest
            asset: sabline-linux
            sep: ":"
          - os: macos-latest
            asset: sabline-macos
            sep: ":"
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5
        with:
          ref: ${{ needs.gate.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6
        with:
          python-version: "3.12"
      - name: Install with proofs, native speed, and PyInstaller
        run: pip install ".[full]" pyinstaller
      - name: Build standalone executable
        run: >
          pyinstaller --onefile --name sabline
          --collect-submodules sabline
          --collect-all z3 --collect-all llvmlite
          --add-data "stdlib${{ matrix.sep }}stdlib"
          --add-data "sabline/site.css${{ matrix.sep }}sabline"
          sabline.py
      - name: Smoke test the executable
        shell: bash
        run: |
          ./dist/sabline* --version
          ./dist/sabline* doctor
          ./dist/sabline* examples/hello.vel
          # the demo starts two runs of this same executable (8.5)
          ./dist/sabline* demo
          # check runs its work in a child under a ceiling; until 8.2 the
          # executable started sabline.py for it, which it does not hold,
          # and every check failed with E001 (found by sabline-canary)
          ./dist/sabline* check examples/discount.vel
          # the executable confines its runs too (8.4): a process the runtime
          # itself tries to start is refused by the operating system on all
          # three systems, and is started under --no-confine
          if SABLINE_FAULT_INJECT=spawn ./dist/sabline* examples/hello.vel 2> fault.txt; then
            cat fault.txt; echo "::error::the executable's run was not confined"; exit 1
          fi
          grep -q 'E319' fault.txt
          SABLINE_FAULT_INJECT=spawn ./dist/sabline* examples/hello.vel --no-confine
      - name: Rename asset
        shell: bash
        run: |
          cd dist
          for f in sabline sabline.exe; do
            [ -f "$f" ] && mv "$f" "${{ matrix.asset }}"
          done
          ls
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6  # v4.1.2
      - name: Sign the executable (cosign, keyless)
        shell: bash
        run: |
          cd dist
          cosign sign-blob --yes "${{ matrix.asset }}" \
            --output-signature "${{ matrix.asset }}.sig" \
            --output-certificate "${{ matrix.asset }}.pem" \
            --bundle "${{ matrix.asset }}.sigstore.json"
          sha256sum "${{ matrix.asset }}" > "${{ matrix.asset }}.sha256"
          ls
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: binary-${{ matrix.asset }}
          path: dist/${{ matrix.asset }}*
          if-no-files-found: error

  attestation:
    name: a signed in-toto attestation of one example program, and a receipt of one run of it
    needs: gate
    if: needs.gate.outputs.build == 'true' && needs.gate.outputs.prerelease != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write            # sigstore keyless signing
    env:
      PREDICATE_TYPE: https://sabline.dev/capability/v1
      OIDC_ISSUER: https://token.actions.githubusercontent.com
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5
        with:
          ref: ${{ needs.gate.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6
        with:
          python-version: "3.12"
      # with the prover, as a reviewer's machine would have it: the
      # audit says whether one ran (prover), so the Statement differs
      # without it
      - name: This commit's Sabline with its prover, and sigstore-python
        run: pip install ".[full]" "sigstore==4.5.0"
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6  # v4.1.2
      # the Statement, unsigned, as sabline attest writes it; the time is
      # the commit's, so two runs of one commit write the same bytes
      - name: The Statement, from sabline attest
        run: |
          V=$(python -c "import sabline; print(sabline.VERSION)")
          echo "ATT=sabline-attestation-$V" >> "$GITHUB_ENV"
          SOURCE_DATE_EPOCH=$(git log -1 --format=%ct) \
            sabline attest examples/effects.vel --output "sabline-attestation-$V.intoto.json"
          cat "sabline-attestation-$V.intoto.json"
      - name: Signed with cosign, as a DSSE envelope (keyless)
        run: |
          cosign attest-blob --yes --statement "$ATT.intoto.json" \
            --bundle "$ATT.cosign.sigstore.json"
      # sigstore-python's command line attests only SLSA provenance, so
      # this uses its library, as EMBEDDING.md shows
      - name: Signed with sigstore-python, as a DSSE envelope (keyless)
        run: |
          python - "$ATT.intoto.json" "$ATT.sigstore-python.sigstore.json" <<'EOF'
          import sys
          from sigstore.dsse import Statement
          from sigstore.models import ClientTrustConfig
          from sigstore.oidc import IdentityToken, detect_credential
          from sigstore.sign import SigningContext
          statement_file, bundle_file = sys.argv[1], sys.argv[2]
          statement = Statement(open(statement_file, "rb").read())
          context = SigningContext.from_trust_config(ClientTrustConfig.production())
          with context.signer(IdentityToken(detect_credential())) as signer:
              bundle = signer.sign_dsse(statement)
          open(bundle_file, "w").write(bundle.to_json())
          EOF
      # both must verify as this workflow on this ref, over this exact
      # Statement, naming the digest of the file it attests
      - name: Both verify, as this workflow, against the example's bytes
        run: |
          IDENTITY="https://github.com/$GITHUB_REPOSITORY/.github/workflows/release.yml@$GITHUB_REF"
          echo "identity: $IDENTITY"
          cosign verify-blob-attestation --bundle "$ATT.cosign.sigstore.json" \
            --type "$PREDICATE_TYPE" --certificate-identity "$IDENTITY" \
            --certificate-oidc-issuer "$OIDC_ISSUER" examples/effects.vel
          python - "$ATT.sigstore-python.sigstore.json" "$ATT.intoto.json" "$IDENTITY" <<'EOF'
          import hashlib, json, os, sys
          from sigstore.models import Bundle
          from sigstore.verify import Verifier
          from sigstore.verify.policy import Identity
          bundle_file, statement_file, identity = sys.argv[1:4]
          bundle = Bundle.from_json(open(bundle_file, "rb").read())
          kind, payload = Verifier.production().verify_dsse(
              bundle, Identity(identity=identity, issuer=os.environ["OIDC_ISSUER"]))
          signed = json.loads(payload)
          assert kind == "application/vnd.in-toto+json", kind
          assert signed == json.load(open(statement_file, encoding="utf-8")), "not this Statement"
          assert signed["predicateType"] == os.environ["PREDICATE_TYPE"]
          digest = hashlib.sha256(open("examples/effects.vel", "rb").read()).hexdigest()
          assert signed["subject"][0]["digest"]["sha256"] == digest, "another file"
          print("sigstore-python: verified, as", identity)
          EOF
      # 8.1: the receipt of one run of the same program - the "after" to the
      # attestation's "before", bound to the same bytes - signed and verified
      # the same two ways. The program writes report.txt here, which is what
      # its budget grants.
      - name: The receipt of one run, from sabline --receipt
        run: |
          V=$(python -c "import sabline; print(sabline.VERSION)")
          echo "REC=sabline-receipt-$V" >> "$GITHUB_ENV"
          sabline examples/effects.vel \
            --allow clock,fs:read:report.txt,fs:write:report.txt,io,rand \
            --receipt "sabline-receipt-$V.intoto.json"
          cat "sabline-receipt-$V.intoto.json"
          python - "sabline-receipt-$V.intoto.json" "$ATT.intoto.json" <<'EOF'
          import json, sys
          receipt = json.load(open(sys.argv[1], encoding="utf-8"))
          attestation = json.load(open(sys.argv[2], encoding="utf-8"))
          assert receipt["predicateType"] == "https://sabline.dev/receipt/v1"
          assert receipt["subject"] == attestation["subject"], "not the attestation's subjects"
          assert receipt["predicate"]["exit"]["outcome"] == "ok", receipt["predicate"]["exit"]
          print("receipt: the attestation's subjects, outcome ok")
          EOF
      - name: The receipt, signed with cosign and with sigstore-python (keyless)
        run: |
          cosign attest-blob --yes --statement "$REC.intoto.json" \
            --bundle "$REC.cosign.sigstore.json"
          python - "$REC.intoto.json" "$REC.sigstore-python.sigstore.json" <<'EOF'
          import sys
          from sigstore.dsse import Statement
          from sigstore.models import ClientTrustConfig
          from sigstore.oidc import IdentityToken, detect_credential
          from sigstore.sign import SigningContext
          statement_file, bundle_file = sys.argv[1], sys.argv[2]
          statement = Statement(open(statement_file, "rb").read())
          context = SigningContext.from_trust_config(ClientTrustConfig.production())
          with context.signer(IdentityToken(detect_credential())) as signer:
              bundle = signer.sign_dsse(statement)
          open(bundle_file, "w").write(bundle.to_json())
          EOF
      - name: Both receipt signatures verify, as this workflow, against the example's bytes
        env:
          RECEIPT_TYPE: https://sabline.dev/receipt/v1
        run: |
          IDENTITY="https://github.com/$GITHUB_REPOSITORY/.github/workflows/release.yml@$GITHUB_REF"
          cosign verify-blob-attestation --bundle "$REC.cosign.sigstore.json" \
            --type "$RECEIPT_TYPE" --certificate-identity "$IDENTITY" \
            --certificate-oidc-issuer "$OIDC_ISSUER" examples/effects.vel
          python - "$REC.sigstore-python.sigstore.json" "$REC.intoto.json" "$IDENTITY" <<'EOF'
          import hashlib, json, os, sys
          from sigstore.models import Bundle
          from sigstore.verify import Verifier
          from sigstore.verify.policy import Identity
          bundle_file, statement_file, identity = sys.argv[1:4]
          bundle = Bundle.from_json(open(bundle_file, "rb").read())
          kind, payload = Verifier.production().verify_dsse(
              bundle, Identity(identity=identity, issuer=os.environ["OIDC_ISSUER"]))
          signed = json.loads(payload)
          assert kind == "application/vnd.in-toto+json", kind
          assert signed == json.load(open(statement_file, encoding="utf-8")), "not this Statement"
          assert signed["predicateType"] == os.environ["RECEIPT_TYPE"]
          digest = hashlib.sha256(open("examples/effects.vel", "rb").read()).hexdigest()
          assert signed["subject"][0]["digest"]["sha256"] == digest, "another file"
          print("sigstore-python: the receipt verified, as", identity)
          EOF
      - name: Keep them
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: attestation
          path: |
            sabline-attestation-*
            sabline-receipt-*
          if-no-files-found: error

  # ---- held to the previous release (8.2) -------------------------------------

  # Pure-numeric time, native and interpreted, against the previous tag,
  # the two taking turns on the same programs. More than 25% slower and the
  # commit is not tagged (perf_gates.py; RELEASING.md). The numbers a
  # release publishes come from the same script on a quiet machine.
  perf:
    name: pure-numeric time against the previous release
    needs: gate
    if: needs.gate.outputs.build == 'true' && needs.gate.outputs.prerelease != 'true'
    runs-on: ubuntu-latest
    env:
      PREVIOUS: ${{ needs.gate.outputs.previous_tag }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5
        with:
          ref: ${{ needs.gate.outputs.sha }}
          fetch-depth: 0             # the previous tag
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6
        with:
          python-version: "3.12"
      - name: Install (full)
        run: pip install -c requirements/ci.txt ".[full]"
      - name: Against the previous tag
        run: python perf_gates.py --only numeric --runs 3 --against "$PREVIOUS"

  # The examples, sabline-spec's conformance corpus and the quick benchmark,
  # run under this commit and under the previous tag. A difference the
  # CHANGELOG entry does not name stops the release (check_differential.py).
  differential:
    name: every difference from the previous release is named
    needs: gate
    if: needs.gate.outputs.build == 'true' && needs.gate.outputs.prerelease != 'true'
    runs-on: ubuntu-latest
    env:
      PREVIOUS: ${{ needs.gate.outputs.previous_tag }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5
        with:
          ref: ${{ needs.gate.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5
        with:
          repository: gowrishankar-infra/sabline-spec
          path: sabline-spec
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6
        with:
          python-version: "3.12"
      - name: Install (full)
        run: pip install -c requirements/ci.txt ".[full,test]"
      - name: This commit against the previous tag
        run: python check_differential.py --old "$PREVIOUS" --spec sabline-spec/tests --benchmark quick

  # ---- tag, then publish in order ---------------------------------------------

  # The kill switch. RELEASE_PAUSED is a variable of the release environment
  # (Settings, Environments, release). Set to anything but empty, 0, false,
  # no or off, this says so and the tag and every publish after it are
  # skipped, while the tests and the builds above still run. RELEASING.md
  # says when to use it and how to release once it is cleared.
  # ---- a pre-release: the crate, and nothing else ---------------------------

  crate:
    name: the sabline-rt crate, packaged and verified
    needs: gate
    # A pre-release only. An ordinary release does not publish the crate:
    # 9.0.0 will, and that is a change to this file made then, with its own
    # fixture.
    if: needs.gate.outputs.build == 'true' && needs.gate.outputs.prerelease == 'true'
    runs-on: ubuntu-latest
    env:
      V: ${{ needs.gate.outputs.version }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5
        with:
          ref: ${{ needs.gate.outputs.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87  # stable
        with:
          toolchain: stable
      - name: The crate says the version the gate read
        working-directory: rt
        run: |
          said=$(cargo metadata --no-deps --format-version 1 \
                 | python3 -c 'import json,sys; print(json.load(sys.stdin)["packages"][0]["version"])')
          test "$said" = "$V" || { echo "::error::rt/Cargo.toml says $said, the gate read $V"; exit 1; }
      # Built from the committed lockfile, as the release builds
      # everything else (plan/9.0.md, risk 4)
      - name: Build, test and package
        working-directory: rt
        run: |
          cargo build --release --locked
          cargo test --release --locked
          cargo package --locked -p sabline-rt
      - name: What is in the package
        working-directory: rt
        run: |
          cargo package --locked -p sabline-rt --list > ../crate-contents.txt
          cat ../crate-contents.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: crate
          path: |
            rt/target/package/sabline-rt-*.crate
            crate-contents.txt
          if-no-files-found: error

  paused:
    name: is releasing paused?
    needs: gate
    # RELEASE_PAUSED is the kill switch, and it stops a pre-release too
    if: needs.gate.outputs.release == 'true'
    runs-on: ubuntu-latest
    environment: release
    outputs:
      paused: ${{ steps.paused.outputs.paused }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5
        with:
          ref: ${{ needs.gate.outputs.sha }}
          persist-credentials: false
      - name: RELEASE_PAUSED
        id: paused
        env:
          RELEASE_PAUSED: ${{ vars.RELEASE_PAUSED }}
        run: python3 release_checks.py paused --annotate --github-output "$GITHUB_OUTPUT" --summary "$GITHUB_STEP_SUMMARY"

  tag:
    name: tag the commit
    needs: [gate, paused, perf, differential, dist, reproducible, bundle,
            binaries, attestation, crate]
    # A pre-release skips every Python build, so those jobs are skipped
    # rather than successful and the tag must not wait for a result they
    # will never give. `crate` is the one a pre-release does run, and it
    # is skipped on an ordinary release.
    if: >-
      !cancelled() && needs.gate.outputs.release == 'true' &&
      needs.paused.outputs.paused == 'false' &&
      !contains(needs.*.result, 'failure') &&
      !contains(needs.*.result, 'cancelled')
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write            # push the tag
    env:
      V: ${{ needs.gate.outputs.version }}
      TAG: ${{ needs.gate.outputs.tag }}
      SHA: ${{ needs.gate.outputs.sha }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5
        with:
          ref: ${{ needs.gate.outputs.sha }}
          fetch-depth: 0
      # Annotated, not signed. This repository has no tag-signing setup
      # (its earlier tags are unsigned too), this workflow holds no key and
      # must not, and gitsign's keyless signature is one GitHub does not
      # show as verified. The artefacts are what is signed. A tag pushed
      # with GITHUB_TOKEN starts no workflow, which is why everything
      # after this happens in this run.
      - name: Tag it (annotated), unless an earlier attempt of this run did
        run: |
          test "$(git rev-parse HEAD)" = "$SHA"
          if git rev-parse -q --verify "refs/tags/$TAG" > /dev/null; then
            there=$(git rev-parse "$TAG^{commit}")
            if [ "$there" = "$SHA" ]; then
              echo "::notice::$TAG already tags $SHA; not tagging again"
              exit 0
            fi
            echo "::error::$TAG already exists on $there, not on $SHA; refusing to move it"
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "$TAG: $(python3 release_checks.py title "$V")" "$SHA"
          git push origin "refs/tags/$TAG"
          echo "::notice::tagged $SHA as $TAG (annotated, not signed)"

  crates_io:
    name: publish the crate to crates.io
    needs: [gate, tag]
    if: needs.gate.outputs.release == 'true' && needs.gate.outputs.prerelease == 'true'
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write            # crates.io trusted publishing, no token stored
    env:
      V: ${{ needs.gate.outputs.version }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5
        with:
          ref: ${{ needs.gate.outputs.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87  # stable
        with:
          toolchain: stable
      - name: Is this version on crates.io already?
        id: there
        run: python3 release_checks.py published crates "$V" --annotate --github-output "$GITHUB_OUTPUT"
      # Trusted publishing: crates.io mints a short-lived token from this
      # workflow's GitHub identity, so no publish token is stored anywhere.
      # The trusted publisher on crates.io names this repository, the
      # workflow file release.yml and the environment `release`, as PyPI's
      # and npm's already do - MAINTENANCE.md's secrets table gains no row.
      - uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18  # v1.0.5
        if: steps.there.outputs.published == 'false'
        id: auth
      - name: Publish
        if: steps.there.outputs.published == 'false'
        working-directory: rt
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: cargo publish --locked -p sabline-rt
      - name: crates.io serves it
        run: python3 release_checks.py published crates "$V" --require --timeout 900 --interval 20 --annotate --summary "$GITHUB_STEP_SUMMARY"

  prerelease_github:
    name: a GitHub release, marked pre-release
    needs: [gate, crates_io]
    if: ${{ !cancelled() && needs.gate.outputs.release == 'true' && needs.gate.outputs.prerelease == 'true' && needs.crates_io.result == 'success' }}
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write            # create the release, attach the crate
    env:
      V: ${{ needs.gate.outputs.version }}
      TAG: ${{ needs.gate.outputs.tag }}
      SHA: ${{ needs.gate.outputs.sha }}
      PREVIOUS: ${{ needs.gate.outputs.previous_tag }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5
        with:
          ref: ${{ needs.gate.outputs.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: crate
          path: assets
      - name: Create the release, marked pre-release
        shell: bash
        run: |
          ls -l assets
          python3 release_checks.py notes "$V" --sha "$SHA" --previous "$PREVIOUS" -o notes.md
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "::notice::the GitHub release $TAG is already there; leaving it"
            exit 0
          fi
          gh release create "$TAG" --verify-tag --prerelease \
            --title "$TAG" --notes-file notes.md assets/*
      # The one thing a pre-release must be checked for: that it moved
      # nothing else. Everything published before this run still says what
      # it said, and no "latest" moved.
      - name: Nothing else moved
        run: python3 release_checks.py prerelease-left-alone "$V" --annotate --summary "$GITHUB_STEP_SUMMARY"

  pypi:
    name: publish to PyPI
    needs: [gate, tag]
    if: needs.gate.outputs.release == 'true' && needs.gate.outputs.prerelease != 'true'
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write            # trusted publishing, no API token stored
    env:
      V: ${{ needs.gate.outputs.version }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5
        with:
          ref: ${{ needs.gate.outputs.sha }}
          persist-credentials: false
      - name: Is this version on PyPI already?
        id: there
        run: python3 release_checks.py published pypi "$V" --annotate --github-output "$GITHUB_OUTPUT"
      - name: The same files that were signed
        if: steps.there.outputs.published == 'false'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: pypi-dist
          path: dist
      - name: Publish
        if: steps.there.outputs.published == 'false'
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33  # v1.14.2
        with:
          skip-existing: true

  npm:
    name: publish to npm
    needs: [gate, pypi]
    if: needs.gate.outputs.release == 'true' && needs.gate.outputs.prerelease != 'true'
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write            # trusted publishing; npm adds provenance itself
    env:
      V: ${{ needs.gate.outputs.version }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5
        with:
          ref: ${{ needs.gate.outputs.sha }}
          persist-credentials: false
      - name: Is this version on npm already?
        id: there
        run: python3 release_checks.py published npm "$V" --annotate --github-output "$GITHUB_OUTPUT"
      # npm's trusted publishing needs npm 11.5.1 or later and Node
      # 22.14.0 or later, and adds provenance without --provenance
      # (docs.npmjs.com/trusted-publishers)
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        if: steps.there.outputs.published == 'false'
        with:
          node-version: "24"
          check-latest: true
          registry-url: "https://registry.npmjs.org"
      - name: Publish npm/
        if: steps.there.outputs.published == 'false'
        working-directory: npm
        run: |
          python3 - "$(node --version)" "$(npm --version)" <<'EOF'
          import sys
          def parts(text):
              return tuple(int(p) for p in text.lstrip("v").split("-")[0].split("."))
          node, npm = sys.argv[1], sys.argv[2]
          if parts(node) < (22, 14, 0) or parts(npm) < (11, 5, 1):
              sys.exit(f"trusted publishing needs Node 22.14.0 and npm 11.5.1 or later; this is Node {node}, npm {npm}")
          print(f"Node {node}, npm {npm}")
          EOF
          test "$(node -p "require('./package.json').version")" = "$V"
          npm publish

  vscode:
    name: publish the VS Code extension
    needs: [gate, npm]
    if: needs.gate.outputs.release == 'true' && needs.gate.outputs.prerelease != 'true'
    runs-on: ubuntu-latest
    environment: release
    # Six attempts of about three minutes, 15.5 minutes of waiting between
    # them, and up to 15 minutes asking whether the extension landed.
    # There is no continue-on-error on this job (8.2.1): the jobs after it
    # still run whatever it did (github_release asks only that it was not
    # cancelled), and a job that published nothing is red.
    timeout-minutes: 75
    env:
      V: ${{ needs.gate.outputs.version }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5
        with:
          ref: ${{ needs.gate.outputs.sha }}
          persist-credentials: false
      - name: Is this version on the Marketplace already?
        id: there
        run: python3 release_checks.py published vscode "$V" --annotate --github-output "$GITHUB_OUTPUT"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        if: steps.there.outputs.published == 'false'
        with:
          node-version: "22"        # Node 20 is in maintenance; 22 is LTS
      # The Marketplace times out - "Request timeout: /_apis/gallery" -
      # often enough that it took out 3.3.0, 3.4.0, 4.3.0 and 8.2.0. So a
      # timeout is tried again, up to five times, 30 s after the first
      # attempt and twice as long before each retry after that, and a
      # publish that landed anyway counts. Anything that is not an outage
      # (no token, a token or a manifest the Marketplace refuses) is not
      # tried again. This step does not decide the job; the next one does.
      - name: Publish to the Marketplace
        id: publish
        if: steps.there.outputs.published == 'false'
        continue-on-error: true
        working-directory: editor/vscode
        run: |
          say() { echo "detail=$1" >> "$GITHUB_OUTPUT"; echo "$1"; }
          if [ -z "$VSCE_TOKEN" ]; then
            say "no VSCE_TOKEN secret is set, so nothing was attempted"
            exit 1
          fi
          npm install -g @vscode/vsce
          npm version "$V" --no-git-tag-version --allow-same-version
          landed() { vsce show gowrishankar-infra.sabline | grep -qF "$V"; }
          # what an outage looks like in vsce's own words
          outage="Request timeout|ETIMEDOUT|ECONNRESET|ECONNREFUSED"
          outage="$outage|socket hang up|EAI_AGAIN|503|502|504"
          retries=5
          wait=30
          attempt=0
          while :; do
            attempt=$((attempt + 1))
            echo "--- attempt $attempt of $((retries + 1))"
            if vsce publish --pat "$VSCE_TOKEN" > publish.log 2>&1; then
              cat publish.log
              say "published on attempt $attempt"
              exit 0
            fi
            cat publish.log
            if landed; then
              say "attempt $attempt failed, but $V is on the Marketplace"
              exit 0
            fi
            if ! grep -Eqi "$outage" publish.log; then
              say "vsce refused the publish on attempt $attempt, and not for an outage; its log says why"
              exit 1
            fi
            if [ "$attempt" -gt "$retries" ]; then
              say "the Marketplace timed out on all $attempt attempts"
              exit 1
            fi
            echo "the Marketplace timed out; retry $attempt of $retries in ${wait}s"
            sleep "$wait"
            wait=$((wait * 2))
          done
        env:
          VSCE_TOKEN: ${{ secrets.VSCE_TOKEN }}
      # The job's verdict, asked of the Marketplace itself, and the line in
      # its summary: the extension is there, or this step fails and the job
      # is red. It keeps asking for a while, because the Marketplace lists a
      # version some minutes after accepting it.
      - name: Is it on the Marketplace now?
        if: always()
        env:
          DETAIL: ${{ steps.publish.outputs.detail }}
        run: |
          echo "### VS Code extension" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          if [ -n "$DETAIL" ]; then
            echo "The publish step: $DETAIL." >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
          fi
          python3 release_checks.py published vscode "$V" --require --timeout 900 --interval 30 --annotate --summary "$GITHUB_STEP_SUMMARY"

  github_release:
    name: the GitHub release, with every artefact
    needs: [gate, npm, vscode]
    # after the Marketplace whatever it did, as before; after npm only if
    # npm published
    if: ${{ !cancelled() && needs.gate.outputs.release == 'true' && needs.gate.outputs.prerelease != 'true' && needs.npm.result == 'success' }}
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write            # create the release, attach files
    env:
      V: ${{ needs.gate.outputs.version }}
      TAG: ${{ needs.gate.outputs.tag }}
      SHA: ${{ needs.gate.outputs.sha }}
      PREVIOUS: ${{ needs.gate.outputs.previous_tag }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5
        with:
          ref: ${{ needs.gate.outputs.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: release-dist
          path: assets
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: bundle
          path: assets
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          pattern: binary-*
          merge-multiple: true
          path: assets
      - name: Create the release, or attach only what it lacks
        shell: bash
        run: |
          ls -l assets
          python3 release_checks.py notes "$V" --sha "$SHA" --previous "$PREVIOUS" -o notes.md
          if gh release view "$TAG" > /dev/null 2>&1; then
            have=$(gh release view "$TAG" --json assets --jq '.assets[].name')
            missing=()
            for f in assets/*; do
              grep -qxF "$(basename "$f")" <<< "$have" || missing+=("$f")
            done
            if [ ${#missing[@]} -eq 0 ]; then
              echo "::notice::the GitHub release $TAG is already there with every file; skipping it"
              exit 0
            fi
            echo "::notice::the GitHub release $TAG is already there; attaching the ${#missing[@]} file(s) it lacks"
            gh release upload "$TAG" "${missing[@]}"
          else
            gh release create "$TAG" --verify-tag --title "$TAG" --notes-file notes.md assets/*
          fi

  mcp_registry:
    name: publish to the MCP registry
    needs: [gate, github_release]
    if: ${{ !cancelled() && needs.gate.outputs.release == 'true' && needs.gate.outputs.prerelease != 'true' && needs.github_release.result == 'success' }}
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write            # mcp-publisher login github-oidc
    env:
      V: ${{ needs.gate.outputs.version }}
      # pinned; the checksum is registry_1.8.1_checksums.txt's. An
      # "invalid audience" from login means this is too old for the
      # registry: move both to its newest release.
      MCP_PUBLISHER: "1.8.1"
      MCP_PUBLISHER_SHA256: a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5
        with:
          ref: ${{ needs.gate.outputs.sha }}
          persist-credentials: false
      - name: Is this version in the registry already?
        id: there
        run: python3 release_checks.py published registry "$V" --annotate --github-output "$GITHUB_OUTPUT"
      # The registry accepts a version only when the PyPI and the npm
      # package of exactly that version name this server - mcp-name in
      # PyPI's description, mcpName in npm's package.json. Both are
      # minutes old here, so wait until both indexes serve them.
      - name: Wait until PyPI and npm serve this version, naming the server
        if: steps.there.outputs.published == 'false'
        run: python3 release_checks.py registry-ready "$V" --timeout 900 --annotate
      - name: Install mcp-publisher, checked against its release's checksum
        if: steps.there.outputs.published == 'false'
        run: |
          curl -sSfL -o mcp-publisher.tar.gz \
            "https://github.com/modelcontextprotocol/registry/releases/download/v$MCP_PUBLISHER/mcp-publisher_linux_amd64.tar.gz"
          echo "$MCP_PUBLISHER_SHA256  mcp-publisher.tar.gz" | sha256sum -c -
          tar xzf mcp-publisher.tar.gz mcp-publisher
          ./mcp-publisher --version
      - name: Publish server.json, listing PyPI and npm, logged in by GitHub OIDC
        if: steps.there.outputs.published == 'false'
        working-directory: integrations/mcp_registry
        run: |
          python3 - "$V" <<'EOF'
          import json, sys
          doc = json.load(open("server.json", encoding="utf-8"))
          kinds = sorted(p["registryType"] for p in doc["packages"])
          versions = {doc["version"]} | {p["version"] for p in doc["packages"]}
          assert kinds == ["npm", "pypi"], kinds
          assert versions == {sys.argv[1]}, versions
          print("server.json", sys.argv[1], "lists", " and ".join(kinds))
          EOF
          ../../mcp-publisher validate server.json
          ../../mcp-publisher login github-oidc
          ../../mcp-publisher publish

  attach_attestation:
    name: the attestation, attached to the release
    needs: [gate, mcp_registry]
    if: ${{ !cancelled() && needs.gate.outputs.release == 'true' && needs.gate.outputs.prerelease != 'true' && needs.mcp_registry.result == 'success' }}
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write            # attach files to the release
    env:
      TAG: ${{ needs.gate.outputs.tag }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: attestation
          path: attestation
      - name: Attach what the release lacks
        shell: bash
        run: |
          have=$(gh release view "$TAG" --json assets --jq '.assets[].name')
          missing=()
          for f in attestation/*; do
            grep -qxF "$(basename "$f")" <<< "$have" || missing+=("$f")
          done
          if [ ${#missing[@]} -eq 0 ]; then
            echo "::notice::the attestation is already attached to $TAG; skipping it"
            exit 0
          fi
          gh release upload "$TAG" "${missing[@]}"

  consistency:
    name: PyPI, npm, the registry, the release and the extension all say this version
    needs: [gate, attach_attestation]
    if: ${{ !cancelled() && needs.gate.outputs.release == 'true' && needs.gate.outputs.prerelease != 'true' && needs.attach_attestation.result == 'success' }}
    runs-on: ubuntu-latest
    env:
      V: ${{ needs.gate.outputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5
        with:
          ref: ${{ needs.gate.outputs.sha }}
          persist-credentials: false
      # indexes serve from caches, so it keeps asking for a while before
      # it calls a difference a difference
      - name: Every one reports this version
        run: python3 release_checks.py consistent "$V" --timeout 900 --annotate --summary "$GITHUB_STEP_SUMMARY"

  advisory:
    name: a draft security advisory, if the release adds one
    needs: [gate, tag, consistency]
    if: ${{ !cancelled() && needs.gate.outputs.release == 'true' && needs.gate.outputs.prerelease != 'true' && needs.tag.result == 'success' }}
    runs-on: ubuntu-latest
    env:
      TAG: ${{ needs.gate.outputs.tag }}
      SHA: ${{ needs.gate.outputs.sha }}
      PREVIOUS: ${{ needs.gate.outputs.previous_tag }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5
        with:
          ref: ${{ needs.gate.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false
      # GITHUB_TOKEN cannot create a repository security advisory or
      # request a CVE: both endpoints need the "Repository security
      # advisories" permission, and a workflow's permissions block has no
      # key that grants it. So this calls no API. It writes the request
      # and prints the two gh commands for a maintainer, which make a
      # DRAFT; publishing an advisory is always a person's decision.
      - name: Any advisory-*.md this release adds
        shell: bash
        run: |
          found=$(python3 release_checks.py advisories "$PREVIOUS" "$SHA")
          if [ -z "$found" ]; then
            echo "::notice::this release adds no advisory-*.md; there is no advisory to draft"
            exit 0
          fi
          mkdir -p advisory-requests
          while IFS= read -r file; do
            name=$(basename "$file" .md)
            python3 release_checks.py advisory-body "$file" -o "advisory-requests/$name.json"
            python3 release_checks.py advisory-commands "$file" --tag "$TAG" \
              --annotate --summary "$GITHUB_STEP_SUMMARY"
          done <<< "$found"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        if: hashFiles('advisory-requests/*.json') != ''
        with:
          name: advisory-requests
          path: advisory-requests/

  # ---- after the release: the pins, moved by the run that made the tag -----

  # README.md and EMBEDDING.md pin the Action by commit, and run_tests.py
  # holds that commit to the newest tag - so from the moment the tag exists,
  # main's first test step fails until the pins name it. A release commit
  # cannot name its own hash; until 8.4 a person moved the pins afterwards,
  # and main was red until they did. This job makes that commit: the pins,
  # the version: example, the pre-commit rev:, and the pages built from those
  # documents, and nothing else. The gate is asked about the commit before
  # it is pushed and must say it is not a release. A push made with
  # GITHUB_TOKEN starts no workflow, so the tests are started by name.
  move_pins:
    name: move the Action pins to the tag
    needs: [gate, tag, consistency]
    if: ${{ !cancelled() && needs.gate.outputs.release == 'true' && needs.gate.outputs.prerelease != 'true' && needs.tag.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write            # push the commit to main
      actions: write             # start the tests on it
    env:
      TAG: ${{ needs.gate.outputs.tag }}
      SHA: ${{ needs.gate.outputs.sha }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5
        with:
          ref: main
          fetch-depth: 0
      - name: Move the pins, rebuild the pages, and push exactly that
        id: move
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          attempt=0
          while :; do
            attempt=$((attempt + 1))
            git fetch --quiet --tags origin main
            git checkout --quiet --detach origin/main
            git reset --quiet --hard origin/main
            test "$(git rev-parse "$TAG^{commit}")" = "$SHA"
            git merge-base --is-ancestor "$SHA" HEAD
            python3 release_checks.py move-pins "$TAG" --commit "$SHA"
            python3 build_docs.py > /dev/null
            git add -- README.md EMBEDDING.md docs
            if [ -n "$(git status --porcelain --untracked-files=all | grep -v '^[MA]  ' || true)" ]; then
              echo "::error::moving the pins changed more than README.md, EMBEDDING.md and docs/"
              git status --porcelain --untracked-files=all
              exit 1
            fi
            if git diff --cached --quiet; then
              echo "::notice::the pins already name $TAG; nothing to push"
              echo "pushed=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            git commit --quiet -m "Move the Action pins to $TAG" \
              -m "$TAG tags $SHA, so the pins in README.md and EMBEDDING.md, the version: example beside them, the pre-commit rev:, and the pages built from those documents name that commit. Made by release.yml in the run that tagged it; this push is not a release."
            decided=$(mktemp)
            python3 release_checks.py gate --github-output "$decided"
            if ! grep -qx 'release=false' "$decided"; then
              echo "::error::the gate reads the pin commit as a release; not pushing it"
              exit 1
            fi
            if git push --quiet origin "HEAD:refs/heads/main"; then
              echo "::notice::pushed $(git rev-parse HEAD) to main: the Action pins name $TAG"
              echo "pushed=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            if [ "$attempt" -ge 5 ]; then
              echo "::error::main moved five times while the pins were being pushed"
              exit 1
            fi
            echo "::notice::main moved; moving the pins again on top of it"
          done
      - name: Start the tests on that commit
        if: steps.move.outputs.pushed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run test.yml --ref main
