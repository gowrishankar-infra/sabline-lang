[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "velaris-lang"
version = "8.1.1"
description = "The language where you can trust code you didn't write - signatures declare types, effects, and machine-checked promises."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Palakurthi Gowri Shankar" }]
keywords = ["language", "compiler", "verification", "effects", "contracts", "z3"]

[project.optional-dependencies]
full = ["z3-solver", "llvmlite"]
# for the suites only, never for Velaris itself: jsonschema validates
# check_library.py's SARIF output against the OASIS schema, and fastapi
# with an http client is what examples/platform is written against, so
# check_platform.py can exercise it rather than skip
test = ["jsonschema>=4.18", "fastapi", "httpx"]

[project.scripts]
velaris = "velaris:main"

[project.urls]
Homepage = "https://github.com/gowrishankar-infra/velaris-lang"

[tool.hatch.build.targets.wheel]
only-include = ["velaris.py", "velaris_mcp.py", "velaris_mcp_install.py", "velaris_magic.py"]

[tool.hatch.build.targets.wheel.force-include]
"LLM.md" = "LLM.md"
"velaris_mcp.py" = "velaris_mcp.py"
"velaris_mcp_install.py" = "velaris_mcp_install.py"
"velaris_magic.py" = "velaris_magic.py"
"stdlib" = "stdlib"

[tool.hatch.build]

